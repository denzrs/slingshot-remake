<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE – Slingshot menu concept</title>
<!--
  PROTOTYPE, throw me away. Does not touch the real app (not in tsconfig, not built by vite).
  Question: how close can the menu get to the concept screenshots while still meaning what the game has?
  Everything here is a real mode, rule, seat, room option or lobby step of the game, laid out in the
  concept's style. The data (rooms, daily sectors, players) is made up. Nothing is saved.
  Screens: ?screen=menu|setup|daily|lobby|create|room (or the bar at the bottom).
  The earlier three-variant prototype is in variants.html.
-->
<style>
@font-face{font-family:'Big Shoulders Stencil Display';font-weight:800;src:url(../../node_modules/@fontsource/big-shoulders-stencil-display/files/big-shoulders-stencil-display-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'B612';font-weight:400;src:url(../../node_modules/@fontsource/b612/files/b612-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'B612';font-weight:700;src:url(../../node_modules/@fontsource/b612/files/b612-latin-700-normal.woff2) format('woff2')}
:root{--plate:#0b1a33;--deep:#07122a;--line:#5b7db3;--bone:#e8e4d8;--dim:#9aa6bd;--faint:rgba(91,125,179,.35);--sodium:#ffd27a;--p1:#ff8660;--p2:#6fe3c8;--danger:#ff5a6e;

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--deep);color:var(--bone);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}

button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
#bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 70% 35%,#132a52 0%,transparent 60%),radial-gradient(ellipse at 15% 85%,#0f2347 0%,transparent 55%),var(--deep)}

.ruler:after{content:"";position:absolute;right:0;top:0;bottom:0;width:4px;background:repeating-linear-gradient(180deg,rgba(91,125,179,.8) 0 1px,transparent 1px 110px)}

:focus-visible{outline:2px solid var(--bone);outline-offset:3px;border-radius:4px}
.screen{min-height:100%;display:flex;flex-direction:column}
.eyebrow{font-family:var(--display);font-weight:800;font-size:clamp(14px,1.5vw,22px);letter-spacing:.06em;color:var(--p1);text-transform:uppercase}

.title{font-family:var(--display);font-weight:800;font-size:clamp(40px,5.2vw,84px);line-height:.92;margin:0;text-transform:uppercase;text-shadow:0 3px 0 rgba(3,8,20,.55)}
.subtitle{font-family:var(--display);font-weight:800;font-size:clamp(20px,2.2vw,34px);color:var(--p1);text-transform:uppercase;letter-spacing:.04em;margin:2px 0 0}
.lede{color:var(--dim);font-size:clamp(13px,1.05vw,16px);line-height:1.55;max-width:52ch;margin:10px 0 0}
.lbl{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.12em;color:var(--p1);text-transform:uppercase;margin:0 0 8px;display:flex;gap:14px;align-items:center}

/* main menu */
.home{display:grid;grid-template-columns:minmax(220px,30%) 1fr;gap:clamp(20px,3vw,56px);margin-top:clamp(14px,3vh,40px);flex:1;align-items:start}

.card.sel .ht{color:var(--bone)}

.sumbar b{color:var(--p2);font-weight:700}

.foot{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:16px;margin-top:auto;padding:26px 0 14px;position:sticky;bottom:0;z-index:5;background:linear-gradient(180deg,transparent,rgba(7,18,42,.92) 38%)}
.keys{font-size:13px;color:var(--dim)}

.ctas{justify-self:end;display:flex;flex-direction:column;align-items:flex-end;gap:8px}

.cta.off{opacity:.45;box-shadow:none}
.cta:focus-visible{outline-color:var(--p1)}
.link{font-size:14px;color:var(--dim)}
.link:hover{color:var(--bone)}
.btn{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.06em;text-transform:uppercase;border:1.5px solid rgba(91,125,179,.7);border-radius:6px;padding:6px 16px 4px;color:var(--bone);background:rgba(10,24,48,.7);white-space:nowrap}
.btn:hover{border-color:var(--bone)}
.btn.sm{font-size:15px;padding:4px 10px 3px}
.btn.acc{border-color:var(--p1);color:var(--p1)}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
/* panels and controls */
.pnl{border:1.5px solid rgba(91,125,179,.45);border-radius:8px;background:rgba(8,20,42,.78);padding:14px 18px 12px;min-width:0}
.pnl h3{font-family:var(--display);font-weight:800;font-size:clamp(20px,1.7vw,26px);letter-spacing:.05em;text-transform:uppercase;color:#a9b6cf;margin:0 0 6px;padding-bottom:8px;border-bottom:1px solid var(--faint)}
.pnl h4{font-size:11px;letter-spacing:.18em;color:var(--p1);text-transform:uppercase;margin:12px 0 2px;font-weight:700}
.ctl{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 14px;padding:7px 0;border-bottom:1px solid rgba(91,125,179,.16);font-size:clamp(13px,1.05vw,15.5px)}
.ctl.slrow{grid-template-columns:minmax(110px,1fr) minmax(110px,1.3fr) 54px}
.ctl:last-child{border-bottom:0}
.ctl.inactive{opacity:.4}
.ctl.inactive .sl,.ctl.inactive .kinds{pointer-events:none}
.sl{position:relative;height:22px;cursor:pointer;display:flex;align-items:center}
.tr{position:relative;height:6px;width:100%;border-radius:3px;background:rgba(91,125,179,.35)}
.tr .fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--p2);box-shadow:0 0 10px rgba(111,227,200,.5)}
.tr i{position:absolute;top:-3px;width:1px;height:12px;background:rgba(232,228,216,.25)}
.tr .knob{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:#bff5e8;border:2px solid var(--p2);transform:translate(-50%,-50%);box-shadow:0 0 10px rgba(111,227,200,.6)}
.sl:focus-visible{outline-offset:5px}
.val{font-size:clamp(14px,1.2vw,18px);color:var(--p2);text-align:right;white-space:nowrap}
.tg{display:inline-flex;border-radius:99px;border:1.5px solid rgba(91,125,179,.6);overflow:hidden;font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.06em}
.tg span{padding:3px 11px 2px;color:#6d7a95}
.tg.on span:first-child{background:var(--p2);color:#06281f;box-shadow:0 0 12px rgba(111,227,200,.6)}
.tg:not(.on) span:last-child{background:rgba(91,125,179,.35);color:var(--bone)}
.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid rgba(91,125,179,.55);border-radius:6px;overflow:hidden}
.seg button{padding:5px 12px;font-size:13.5px;color:var(--dim);border-right:1px solid rgba(91,125,179,.3)}
.seg button:last-child{border-right:0}
.seg button.sel{background:rgba(111,227,200,.16);color:var(--p2);box-shadow:inset 0 0 0 1.5px var(--p2)}
.cy{display:inline-flex;align-items:center;gap:8px;border:1.5px solid rgba(91,125,179,.55);border-radius:6px;padding:4px 8px;font-size:13.5px;min-width:122px;justify-content:space-between}
.cy .ar{color:var(--p1);font-weight:700}
.kinds{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:5px;grid-column:1/-1}
.kind{border:1px solid rgba(91,125,179,.5);border-radius:5px;padding:4px 6px;font-size:11.5px;color:var(--dim);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kind.on{border-color:var(--p2);color:var(--p2);background:rgba(111,227,200,.08)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 10px;border-radius:99px;border:1px solid rgba(91,125,179,.55);color:var(--bone);background:rgba(8,20,42,.6);white-space:nowrap}
.chip.warn{border-color:var(--sodium);color:var(--sodium)}
.chip.tw{font-family:var(--display);font-weight:800;letter-spacing:.05em;font-size:14px}
/* setup */
.shead{display:grid;grid-template-columns:minmax(220px,30%) 1fr;gap:clamp(18px,2.6vw,44px);align-items:end}
.mcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mcards .card .art{aspect-ratio:16/7}
.mcards .card .cap{padding:6px 10px 8px}
.mcards .card .nm{font-size:clamp(16px,1.5vw,23px);border:0;padding:0}
.pcards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;flex:1}
.pcard{flex-direction:row;align-items:center;gap:10px;padding:6px 10px 6px 6px}
.pcard .art{width:64px;flex:none;aspect-ratio:1;border:0;border-radius:5px}
.pcard .nm{font-family:var(--display);font-weight:800;font-size:clamp(16px,1.4vw,21px);text-transform:uppercase;letter-spacing:.04em;line-height:1}
.pcard .ht{font-size:11.5px;color:var(--dim);line-height:1.3;margin-top:3px}
.card.pcard.sel{transform:none}
.card.pcard.sel:before{content:none}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,1.2vw,18px);margin-top:14px;align-items:start}
.seat{display:grid;grid-template-columns:20px minmax(0,1fr) auto auto auto;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(91,125,179,.16);font-size:14px}
.seat svg{width:20px;height:20px}
.x{width:24px;height:24px;border-radius:50%;border:1px solid rgba(91,125,179,.6);color:var(--dim);text-align:center;font-size:13px;line-height:22px}
.x:hover{color:var(--bone);border-color:var(--bone)}
.team{font-size:12px;padding:3px 9px;border-radius:99px;border:1.5px solid}
/* lobby */
.idbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px;border:1.5px solid rgba(91,125,179,.45);border-radius:8px;background:rgba(8,20,42,.78);padding:10px 16px;margin:16px 0 14px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--p2);box-shadow:0 0 10px var(--p2)}
.field{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--dim)}
.inp{background:rgba(3,9,22,.85);border:1.5px solid rgba(91,125,179,.55);border-radius:5px;padding:7px 10px;color:var(--bone);font-size:15px;min-width:0;width:100%}
.inp:focus{border-color:var(--p2);outline:none}
.avs{display:flex;gap:4px;flex-wrap:wrap}
.av{width:34px;height:34px;border:1.5px solid rgba(91,125,179,.5);border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.av svg{width:20px;height:20px}
.av.sel{border-color:var(--bone);color:var(--bone);background:rgba(232,228,216,.1)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(12px,1.6vw,24px);align-items:start}
.roomrow{display:grid;grid-template-columns:38px minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:10px 6px;border-bottom:1px solid rgba(91,125,179,.2)}
.roomrow:last-child{border-bottom:0}
.roomrow .sym{width:34px;height:34px}
.roomrow .nm{font-size:15.5px;font-weight:700}
.pips{display:inline-flex;gap:3px}
.pips i{width:8px;height:8px;border-radius:2px;background:rgba(91,125,179,.4)}
.pips i.on{background:var(--p2)}
.preview .art{display:block;position:relative;aspect-ratio:16/6.5;border:1px solid var(--faint);border-radius:6px;background:rgba(3,9,22,.7);overflow:hidden}
.preview .art svg{position:absolute;inset:0;width:100%;height:100%}
.stats{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 0;border:1px solid var(--faint);border-radius:6px;padding:9px 12px;font-size:15px;margin-top:12px}
.stats span+span:before{content:"|";color:var(--dim);margin:0 12px}
.stats b{color:var(--p2);font-weight:400}
.player{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid rgba(91,125,179,.18);font-size:15px}
.player svg{width:24px;height:24px}
.player.empty{color:#64718c;font-style:italic}
.drawer{position:fixed;top:10px;right:10px;bottom:58px;width:min(560px,94vw);background:#0a1a36;border-left:1.5px solid var(--line);padding:22px 24px;overflow:auto;z-index:30;box-shadow:-30px 0 60px rgba(0,0,0,.5)}
.scrim{position:fixed;inset:0;background:rgba(3,8,20,.55);z-index:29}
.overlay{position:fixed;inset:0;z-index:60;background:rgba(3,8,20,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:var(--bone);color:#10203a;padding:8px 18px;border-radius:99px;font-size:13px;z-index:70}
.sectors{list-style:none;margin:0;padding:0}
.sectors li{display:grid;grid-template-columns:90px 70px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(91,125,179,.2);font-size:14.5px}
#proto{position:fixed;left:50%;bottom:9px;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:2px;background:#f4f1e6;color:#12203a;border-radius:99px;padding:4px 6px;box-shadow:0 6px 24px rgba(0,0,0,.6);font:12px system-ui,sans-serif;max-width:calc(100vw - 16px);overflow-x:auto}
#proto b{padding:0 8px;white-space:nowrap}
#proto button{border-radius:99px;padding:5px 10px;font:12px system-ui,sans-serif;color:#12203a;white-space:nowrap}
#proto button:hover{background:#dcd7c5}
#proto button.on{background:#12203a;color:#f4f1e6}
#proto a{color:#5b6b8a;padding:0 8px;white-space:nowrap}
.sechint{display:none;margin:0 0 12px;font-size:13px;color:var(--dim)}
/* Smaller screens: the menu turns into tabs across the top, the cards go right under them. */
@media (max-width:1100px){
  .home{grid-template-columns:1fr;gap:16px;margin-top:18px}
  .mlist{flex-direction:row;gap:clamp(16px,3.4vw,40px);border-bottom:1px solid var(--faint);padding:0;overflow-x:auto;scrollbar-width:none}
  .mi{font-size:clamp(24px,3.8vw,40px);padding:0 2px 6px;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;flex:none}

  .mi.on{border-bottom-color:var(--p1);text-shadow:none}
  .mi.on:before{content:none}
  .mi:focus-visible:after{left:0;bottom:-4px}
  .sechint{display:block}
}
@media (max-height:780px){.lede{display:none}.wordmark{font-size:clamp(48px,7vw,100px)}}
@media (max-width:640px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .cards{align-items:stretch}
  .card .art{aspect-ratio:16/9}
  .card .ht{display:none}
  .card .nm{border:0;padding:0;font-size:19px}
  .card.sel{transform:none}
  .wordmark{font-size:56px}
  .lede,.keys{display:none}
  .mi{font-size:24px}
  .mlist{gap:18px}
  #app{padding:16px 16px 0}
}
@media (max-width:900px){.shead,.two{grid-template-columns:1fr}.cols{grid-template-columns:1fr}.pcards{grid-template-columns:repeat(2,minmax(0,1fr))}.foot{grid-template-columns:1fr}.lang{display:none}.ctas{justify-self:stretch;align-items:stretch}}
</style>
</head>
<body>
<div id="bg"></div>
<div class="frame"><div class="ruler"></div></div>
<div id="app"></div>
<div id="proto"></div>
<script>
'use strict';
/* ———————————————————— what the game has ———————————————————— */
const KINDS = ['preview', 'teleport', 'splitter', 'polarity', 'shield', 'blackhole', 'planetkiller', 'nebula', 'piercing', 'wormhole', 'defense', 'heavy'];

function slider(id, label, steps, get, set, fmt = String, inactive = false) {
  reg(id, { steps, get, set });
  const i = Math.max(0, steps.indexOf(get())), pct = (i / (steps.length - 1)) * 100;
  return `<div class="ctl slrow${inactive ? ' inactive' : ''}"><span>${label}</span><div class="sl" tabindex="${inactive ? -1 : 0}" ${K(id)} data-slider="${id}" role="slider" aria-label="${label}" aria-valuetext="${fmt(get())}"><div class="tr"><div class="fill" style="width:${pct}%"></div>${steps.length <= 10 ? steps.map((_, j) => `<i style="left:${(j / (steps.length - 1)) * 100}%"></i>`).join('') : ''}<div class="knob" style="left:${pct}%"></div></div></div><span class="val">${fmt(get())}</span></div>`;
}
function toggle(id, label, get, set) {
  reg(id, { get, set });
  return `<div class="ctl"><span>${label}</span><button class="tg ${get() ? 'on' : ''}" ${K(id)} data-act="tg:${id}" role="switch" aria-checked="${get()}" aria-label="${label}"><span>AN</span><span>AUS</span></button></div>`;
}
function segBar(id, opts, get, set) {
  reg(id, { opts, get, set });
  return `<div class="seg">${opts.map(([v, l], j) => `<button class="${same(get(), v) ? 'sel' : ''}" ${K(id + '_' + j)} data-select data-row="${id}" data-act="seg:${id}:${j}">${l}</button>`).join('')}</div>`;
}
const seg = (id, label, opts, get, set) => `<div class="ctl"><span>${label}</span>${segBar(id, opts, get, set)}</div>`;
function cycler(id, opts, get, set) {
  reg(id, { opts, get, set });
  const cur = opts.find(([v]) => v === get());
  return `<button class="cy" ${K(id)} data-cycle="${id}" data-act="cy:${id}:1"><span class="ar">‹</span>${cur[1]}<span class="ar">›</span></button>`;
}

    <h4>Spieler</h4>${slider('rCap', 'Maximale Spielerzahl', [2, 3, 4, 5, 6], () => R.capacity, (v) => { R.capacity = v; })}${seg('rType', 'Spielart', [['ffa', 'Jeder gegen jeden'], ['team', 'Teams']], () => R.matchType, (v) => { R.matchType = v; })}
    <div class="ctl"><span class="row" style="gap:6px;width:100%"><input class="inp" type="${R.showPw ? 'text' : 'password'}" placeholder="Passwort (optional)" data-bind="room.password" value="${R.password}" ${K('rpw')}><button class="btn sm" ${K('rpweye')} data-act="pweye" aria-label="Passwort zeigen">◉</button></span></div>
    ${lookRow}
    <h4>Regeln</h4>${rulesPart}
  </section>${modePreview(R.mode, R.base, R.strength, R.rules, mayhem ? [] : ruleSummary(R.rules, R.mode).slice(4))}</div>
  ${foot(`<button class="btn" ${K('back')} data-act="go:lobby">« Zurück</button>`, `<button class="cta" ${K('cta')} data-act="create">Raum erstellen »</button>`)}</div>`;
}
function roomScreen() {
  const R = S.room, IR = S.inRoom;
  const slots = Array.from({ length: R.capacity }, (_, i) => IR.players[i]);
  const rows = slots.map((p, i) => (p ? `<div class="player"><span style="color:${SEAT_COLORS[i]}">${avatarSvg(p.avatar)}</span><span>${p.name}${p.host ? ' <span class="chip">Host</span>' : ''}${p.cpu ? ` <span class="chip">CPU · ${FLIER_NAME[p.cpu]}</span>` : ''}</span><span class="small" style="color:${p.ready ? 'var(--p2)' : 'var(--dim)'}">${p.ready ? '✓ Bereit' : 'Wartet'}</span>${p.cpu ? `<button class="x" ${K('rmcpu' + i)} data-act="rmcpu:${i}" aria-label="CPU entfernen">×</button>` : '<span></span>'}</div>` : `<div class="player empty"><span></span><span>Freier Platz</span><span></span><span></span></div>`)).join('');
  const humans = IR.players.filter((p) => !p.cpu).length;
  const name = R.name || `Raum von ${S.me.name}`;
  return `<div class="screen">${lobbyHead(`${name} · Code K7QX`)}
  <div class="two"><section class="pnl"><h3>Spieler · ${IR.players.length}/${R.capacity}</h3>${rows}
    <div class="row wrap" style="margin-top:12px;justify-content:space-between">${IR.players.length < R.capacity ? `<span class="row">${cycler('cpuLvl', FLIERS.slice(1).map((f) => [f, FLIER_NAME[f]]), () => IR.cpu, (v) => { IR.cpu = v; })}<button class="btn sm" ${K('addcpu')} data-act="addcpu">+ CPU</button></span>` : '<span class="small muted">Raum voll – ein neuer Mensch verdrängt den neuesten CPU.</span>'}
    <span class="row"><button class="btn sm acc" ${K('invite')} data-act="toast:Einladungslink kopiert">Einladungslink kopieren</button><button class="btn sm" ${K('copycode')} data-act="toast:Code kopiert">Code</button></span></div>
    ${humans < 2 ? '<p class="small" style="color:var(--sodium)">Gegen CPUs allein spielt man lokal – ein Online-Spiel braucht eine zweite Person.</p>' : ''}
  </section>${modePreview(R.mode, R.base, R.strength, R.rules, R.mode === 'mayhem' ? [] : ruleSummary(R.rules, R.mode).slice(4))}</div>
  <p class="small muted" style="text-align:right;margin:8px 0 0">${R.mode === 'mayhem' ? '' : `<button class="link" ${K('rrules')} data-act="drawer">Regeln ändern ›</button> · `}Eine Regeländerung setzt alle auf „nicht bereit“.</p>
  ${foot(`<div class="row" style="gap:12px"><button class="btn" ${K('leave')} data-act="go:lobby">Raum verlassen</button><button class="btn ${IR.ready ? 'acc' : ''}" ${K('ready')} data-act="ready">${IR.ready ? '✓ Bereit' : 'Bereit'}</button></div>`, `<button class="cta ${humans < 2 || !IR.ready ? 'off' : ''}" ${K('cta')} data-act="roomstart">Spiel starten »</button>`)}</div>`;
}
function drawer() {
  const b = ruleBlocks(roomSrc());
  return `<div class="scrim" data-act="drawer"></div><aside class="drawer" role="dialog" aria-label="Regeln des Raums"><div class="row" style="justify-content:space-between"><h2 class="title" style="font-size:44px">Regeln</h2><button class="btn sm acc" ${K('dclose')} data-act="drawer">Fertig</button></div><p class="small muted">Die Regeln des Raums, getrennt von deinen lokalen.</p><section class="pnl" style="margin-bottom:12px"><h3>Spiel</h3>${b.spiel}</section><section class="pnl"><h3>Extras</h3>${b.extras}</section></aside>`;
}

/* ———————————————————— render ———————————————————— */
function render() {
  const focusKey = document.activeElement?.dataset?.k;
  const scroll = app.scrollTop;
  CTL = {};
  const view = { menu: menuScreen, setup: setupScreen, daily: dailyScreen, lobby: lobbyScreen, create: createScreen, room: roomScreen }[S.screen]();
  app.innerHTML = view + (S.drawer ? drawer() : '')
    + (S.playing ? `<div class="overlay"><div class="eyebrow">Prototyp · hier würde das Spiel beginnen</div><h2 class="title">${S.playing.title}</h2><div class="row wrap" style="justify-content:center;gap:6px">${S.playing.chips.map((c) => `<span class="chip">${c}</span>`).join('')}</div><button class="btn" ${K('ov')} data-act="closeplay">Zurück (Esc)</button></div>` : '')
    + (S.toast ? `<div class="toast">${S.toast}</div>` : '');
  app.scrollTop = scroll;
  const target = (focusKey && app.querySelector(`[data-k="${CSS.escape(focusKey)}"]`)) || (S.playing && app.querySelector('[data-k=ov]'));
  if (target) target.focus({ preventScroll: true });
  else if (!app.contains(document.activeElement)) (app.querySelector(S.screen === 'menu' ? `[data-k=m${S.menu}]` : '[data-k=cta]'))?.focus({ preventScroll: true });
  $('#proto').innerHTML = `<b>PROTOTYP</b>${Object.entries(SCREENS).map(([k, l]) => `<button class="${S.screen === k ? 'on' : ''}" data-ps="${k}">${l}</button>`).join('')}<a href="variants.html">alte Varianten</a>`;
  try { const u = new URL(location.href); u.searchParams.set('screen', S.screen); history.replaceState(null, '', u); } catch (e) { /* file:// */ }
}
function go(screen) { S.screen = screen; S.drawer = false; document.activeElement?.blur(); }
function toast(msg) { S.toast = msg; render(); clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = ''; render(); }, 1800); }
function play(title, chips) { S.playing = { title, chips }; S.drawer = false; }
function runMenu() {
  const pick = S.pick[S.menu];
  if (S.menu === 'local') {
    if (pick === 'daily') return play('Tägliche Herausforderung', summary('daily'));
    S.mode = pick;
    return play(MODE[pick].name, summary(pick));
  }
  if (S.menu === 'online') { go(pick === 'create' ? 'create' : 'lobby'); if (pick === 'code') setTimeout(() => app.querySelector('[data-k=code]')?.focus()); return; }
  if (S.menu === 'help') return toast(`Anleitung, ${CARDS[pick].hint}`);
}

/* ———————————————————— actions ———————————————————— */
function act(a) {
  const [name, x, y] = a.split(':');
  switch (name) {
    case 'menu': S.menu = x; break;
    case 'pick': S.pick[x] = y; break;
    case 'run': runMenu(); break;
    case 'setup': S.mode = x; go('setup'); break;
    case 'go': go(x); break;
    case 'mode': S.mode = x; break;
    case 'preset': S.preset = x; S.rules = presetRules(x); break;
    case 'strength': S.mayhem.strength = Number(x); break;
    case 'tg': CTL[x].set(!CTL[x].get()); break;
    case 'seg': CTL[x].set(CTL[x].opts[Number(y)][0]); break;
    case 'cy': { const c = CTL[x], i = c.opts.findIndex(([v]) => v === c.get()); c.set(c.opts[(i + Number(y) + c.opts.length) % c.opts.length][0]); break; }
    case 'kind': { const r = SRC[x].r, on = r.powerUpKinds.includes(y); if (on && r.powerUpKinds.length === 1) return toast('Mindestens eine Sorte bleibt an'); r.powerUpKinds = on ? r.powerUpKinds.filter((k) => k !== y) : KINDS.filter((k) => k === y || r.powerUpKinds.includes(k)); break; }
    case 'team': { const s = S.seats[Number(x)]; s.t = (s.t + 1) % S.teamMode; break; }
    case 'rm': S.seats.splice(Number(x), 1); break;
    case 'add': S.seats.push({ f: x, t: S.seats.length % 2 }); break;
    case 'balance': S.seats.forEach((s, i) => { s.t = i % S.teamMode; }); break;
    case 'start': play(MODE[S.mode].name, S.mode === 'mayhem' ? summary('mayhem') : [...ruleSummary(S.rules, S.mode), lineup()]); break;
    case 'daily': play('Tägliche Herausforderung', summary('daily')); break;
    case 'lang': S.lang = 1 - S.lang; break;
    case 'avatar': S.me.avatar = x; break;
    case 'join': if (x === 'code' && !S.code.trim()) return toast('Gib erst einen Raum-Code ein'); S.inRoom.players[0].host = false; go('room'); break;
    case 'create': S.inRoom.players[0].host = true; go('room'); break;
    case 'rsym': S.room.sym = x; break;
    case 'rcol': S.room.color = x; break;
    case 'pweye': S.room.showPw = !S.room.showPw; break;
    case 'drawer': S.drawer = !S.drawer; if (!S.drawer) document.activeElement?.blur(); break;
    case 'ready': S.inRoom.ready = !S.inRoom.ready; S.inRoom.players[0].ready = S.inRoom.ready; break;
    case 'addcpu': S.inRoom.players.push({ name: FLIER_NAME[S.inRoom.cpu], avatar: 'robot', cpu: S.inRoom.cpu, ready: true }); break;
    case 'rmcpu': S.inRoom.players.splice(Number(x), 1); break;
    case 'roomstart': { const R = S.room; if (!S.inRoom.ready) return toast('Erst bereit melden'); play(MODE[R.mode].name + ' · online', R.mode === 'mayhem' ? [`Chaos: ${STRENGTH[R.strength]}`, `Gespielt als ${MODE[R.base].short}`] : ruleSummary(R.rules, R.mode)); break; }
    case 'toast': return toast(x);
    case 'closeplay': S.playing = null; break;
  }
  render();
}
document.addEventListener('click', (e) => {
  const ps = e.target.closest('[data-ps]');
  if (ps) { S.playing = null; go(ps.dataset.ps); return render(); }
  const sl = e.target.closest('[data-slider]');
  if (sl) {
    const c = CTL[sl.dataset.slider], r = sl.querySelector('.tr').getBoundingClientRect();
    const i = Math.round(Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)) * (c.steps.length - 1));
    c.set(c.steps[i]); sl.focus(); return render();
  }
  const el = e.target.closest('[data-act]');
  if (el && app.contains(el)) act(el.dataset.act);
});
document.addEventListener('dblclick', (e) => { const c = e.target.closest('[data-card]'); if (c && S.screen === 'menu') { runMenu(); render(); } });
app.addEventListener('input', (e) => {
  const path = e.target.dataset.bind;
  if (!path) return;
  const keys = path.split('.'), last = keys.pop();
  keys.reduce((o, k) => o[k], S)[last] = e.target.value;
});
// Pointing at or moving onto a menu entry shows its cards on the right.
function hoverMenu(e) {
  const m = e.target.closest?.('[data-menu]');
  if (m && S.screen === 'menu' && S.menu !== m.dataset.menu) { S.menu = m.dataset.menu; render(); }
}
app.addEventListener('focusin', hoverMenu);
app.addEventListener('mouseover', hoverMenu);

/* ———————————————————— keyboard ———————————————————— */
function move(dir) {
  const scope = S.drawer ? $('.drawer') : app;
  const els = [...scope.querySelectorAll('[data-k]')].filter((e) => e.offsetParent !== null && e.tabIndex >= 0);
  const cur = document.activeElement;
  if (!els.includes(cur)) return els[0]?.focus();
  const c = cur.getBoundingClientRect(), cx = c.left + c.width / 2, cy = c.top + c.height / 2;
  const horiz = dir === 'ArrowLeft' || dir === 'ArrowRight';
  let best = null, bs = Infinity;
  for (const e of els) {
    if (e === cur) continue;
    const r = e.getBoundingClientRect(), x = r.left + r.width / 2 - cx, y = r.top + r.height / 2 - cy;
    const main = dir === 'ArrowRight' ? x : dir === 'ArrowLeft' ? -x : dir === 'ArrowDown' ? y : -y;
    if (main < 6) continue;
    if (horiz && Math.abs(y) > Math.max(c.height, r.height) * 0.6 && !cur.dataset.menu) continue;
    const s = main + (horiz ? Math.abs(y) : Math.abs(x)) * 2.2;
    if (s < bs) { bs = s; best = e; }
  }
  if (!best) return;
  // Entering a strip lands on what is chosen there.
  if (best.dataset.row && best.dataset.row !== cur.dataset.row) best = els.find((e) => e.dataset.row === best.dataset.row && e.classList.contains('sel')) || best;
  best.focus();
  best.scrollIntoView({ block: 'nearest' });
  if (best.dataset.menu && S.menu !== best.dataset.menu) { S.menu = best.dataset.menu; return render(); }
  if (horiz && cur.dataset.row && best.dataset.row === cur.dataset.row && best.dataset.select !== undefined) best.click();
}
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = document.activeElement;
  const typing = t?.matches?.('input');
  if (S.playing) { if (e.key === 'Escape' || e.key === 'Enter') { e.preventDefault(); S.playing = null; render(); } return; }
  if (e.key === 'Escape') {
    if (typing) t.blur();
    if (S.drawer) S.drawer = false;
    else go({ menu: 'menu', setup: 'menu', daily: 'menu', lobby: 'menu', create: 'lobby', room: 'lobby' }[S.screen]);
    return render();
  }
  if (typing) return;
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && (t?.dataset.slider || t?.dataset.cycle)) {
    e.preventDefault();
    const d = e.key === 'ArrowRight' ? 1 : -1;
    if (t.dataset.cycle) return act(`cy:${t.dataset.cycle}:${d}`);
    const c = CTL[t.dataset.slider], i = c.steps.indexOf(c.get());
    c.set(c.steps[Math.min(c.steps.length - 1, Math.max(0, i + d))]);
    return render();
  }
  if (e.key.startsWith('Arrow')) { e.preventDefault(); return move(e.key); }
  if (e.key === 'Enter' && t) {
    // Enter on a menu entry or a card does what the big button says; on a choice of the setup it starts the game.
    if (S.screen === 'menu' && (t.dataset.menu || t.dataset.card) && S.menu !== 'settings') { e.preventDefault(); runMenu(); return render(); }
    if (S.screen === 'setup' && t.dataset.select !== undefined) { e.preventDefault(); return act('start'); }
  }
});
stars();
render();
</script>
</body>
</html>
