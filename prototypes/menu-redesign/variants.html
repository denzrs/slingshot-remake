<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE – Slingshot menu redesign</title>
<!--
  PROTOTYPE, throw me away. Does not touch the real app (not in tsconfig, not built by vite).
  Question: what should the main menu and the "Lokal" page look like?
  Three structurally different variants, switchable via ?variant=A|B|C (also: keys 1 2 3, [ and ]).
  ?screen=menu|local picks the screen. All state is in memory; nothing is saved, nobody is online.
  Open by double-clicking this file (fonts are read from ../../node_modules).
-->
<style>
@font-face{font-family:'Big Shoulders Stencil Display';font-weight:800;src:url(../../node_modules/@fontsource/big-shoulders-stencil-display/files/big-shoulders-stencil-display-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'B612';font-weight:400;src:url(../../node_modules/@fontsource/b612/files/b612-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'B612';font-weight:700;src:url(../../node_modules/@fontsource/b612/files/b612-latin-700-normal.woff2) format('woff2')}
:root{--plate:#0b1a33;--plate2:#10264a;--line:#5b7db3;--bone:#e8e4d8;--dim:#9aa6bd;--sodium:#ffd27a;--p1:#ff8660;--p2:#6fe3c8;--danger:#ff5a6e;
--display:'Big Shoulders Stencil Display','Arial Narrow',sans-serif;--body:'B612',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--plate);color:var(--bone);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(ellipse at 75% 30%,#17335f 0%,transparent 55%),radial-gradient(ellipse at 10% 90%,#12294f 0%,transparent 50%),var(--plate)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
#app{position:absolute;inset:0 0 64px 0;padding:clamp(20px,3.4vw,52px);overflow:auto}
:focus{outline:none}
:focus-visible{outline:2px solid var(--bone);outline-offset:3px;border-radius:6px}
.eyebrow{font-size:11px;letter-spacing:.28em;color:var(--p1);text-transform:uppercase}
.wordmark{font-family:var(--display);font-weight:800;font-size:clamp(48px,8vw,104px);line-height:.9;margin:.1em 0 .15em;letter-spacing:.01em}
.h2{font-family:var(--display);font-weight:800;font-size:clamp(30px,4vw,52px);line-height:1;margin:0}
.lede{color:var(--dim);font-size:14px;line-height:1.6;max-width:44ch;margin:0 0 28px}
.lbl{font-size:11px;letter-spacing:.2em;color:var(--p1);text-transform:uppercase;margin:0 0 8px;display:flex;gap:12px;align-items:center}
.lbl:after{content:"";flex:1;height:1px;background:rgba(91,125,179,.35)}
.chip{display:inline-flex;gap:6px;align-items:center;font-size:12px;padding:4px 11px;border-radius:99px;border:1px solid rgba(91,125,179,.5);color:var(--bone);background:rgba(11,26,51,.6);white-space:nowrap}
.chip.dirty{border-color:var(--sodium);color:var(--sodium)}
.muted{color:var(--dim)}
.cta{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.04em;background:var(--p1);color:#1a0d08;padding:10px 30px 8px;border-radius:6px;display:inline-flex;gap:10px;align-items:center;text-transform:uppercase}
.cta:hover{filter:brightness(1.08)}
.ghost{border:1px solid rgba(91,125,179,.6);border-radius:6px;padding:8px 14px;font-size:13px;color:var(--bone)}
.ghost:hover{border-color:var(--bone)}
.card{position:relative;border:1px solid rgba(91,125,179,.5);border-radius:10px;background:rgba(16,38,74,.65);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.card:hover{border-color:var(--bone)}
.card .n{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.card .h{font-size:12px;color:var(--dim);line-height:1.4}
.card svg{width:100%;height:56px;color:var(--p2);margin-bottom:6px}
.sel{border-color:var(--sodium);background:rgba(255,210,122,.1)}
.nocheck:after{content:none!important}
.bigs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.big{padding:16px 16px 18px;min-height:clamp(230px,36vh,350px);justify-content:flex-end;transition:transform .15s,box-shadow .15s,border-color .15s}
.big svg{height:clamp(60px,12vh,120px);flex:1;margin-bottom:10px}
.big .n{font-size:clamp(16px,1.55vw,25px);overflow-wrap:break-word}
.big:hover,.big:focus-visible{border-color:var(--p1);box-shadow:0 0 0 1px var(--p1),0 0 28px rgba(255,134,96,.35);transform:translateY(-5px);outline:none}
.sel:after{content:"✓";position:absolute;top:8px;right:10px;font-size:13px;color:var(--sodium)}
.row{display:flex;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.seg{display:inline-flex;border:1px solid rgba(91,125,179,.5);border-radius:6px;overflow:hidden}
.seg button{padding:6px 12px;font-size:13px;border-right:1px solid rgba(91,125,179,.3);color:var(--dim)}
.seg button:last-child{border-right:0}
.seg button.sel{background:var(--sodium);color:#241800}
.seg button.sel:after{content:none}
.ctl{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:7px 0;border-bottom:1px solid rgba(91,125,179,.18);font-size:14px}
.sw{width:42px;height:22px;border-radius:99px;border:1px solid rgba(91,125,179,.6);position:relative;flex:none}
.sw:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--dim);transition:.15s}
.sw.on{background:var(--p2);border-color:var(--p2)}
.sw.on:after{left:22px;background:#06201a}
.seat{width:76px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border:1px solid rgba(91,125,179,.5);border-radius:10px;background:rgba(16,38,74,.65);position:relative;text-align:center;font-size:11px}
.seat:hover{border-color:var(--bone)}
.seat svg{width:30px;height:30px}
.seat.add{border-style:dashed;justify-content:center;color:var(--dim);font-size:22px;height:76px}
.seatx{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--plate2);border:1px solid var(--line);font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.keys{font-size:12px;color:var(--dim);margin-top:auto;padding-top:18px}
.keys kbd{font-family:var(--body);font-weight:700;color:var(--bone)}
.screen{min-height:100%;display:flex;flex-direction:column}
.menu{display:flex;flex-direction:column;gap:2px;min-width:210px}
.mi{font-family:var(--display);font-weight:800;font-size:clamp(28px,3vw,40px);letter-spacing:.03em;text-transform:uppercase;padding:4px 14px;border-left:3px solid transparent;color:var(--dim);line-height:1.15}
.mi small{display:block;font-family:var(--body);font-weight:400;font-size:12px;letter-spacing:0;text-transform:none;color:var(--dim)}
.mi.on{color:var(--sodium);border-left-color:var(--sodium);background:linear-gradient(90deg,rgba(255,210,122,.12),transparent)}
.pane{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.cols{display:flex;gap:clamp(20px,4vw,64px);margin-top:8px}
.crumb{font-size:13px;color:var(--dim);margin-bottom:6px;display:inline-flex;gap:6px;padding:2px 0}
.crumb:hover{color:var(--bone)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:auto;padding-top:20px;flex-wrap:wrap}
.drawer{position:fixed;top:0;right:0;bottom:64px;width:min(420px,92vw);background:#0d2040;border-left:1px solid var(--line);padding:24px;overflow:auto;z-index:20;box-shadow:-20px 0 50px rgba(0,0,0,.4)}
.scrim{position:fixed;inset:0 0 64px 0;background:rgba(5,10,20,.5);z-index:19}
.tabs{display:flex;gap:26px;border-bottom:1px solid rgba(91,125,179,.35);margin:14px 0 18px}
.tab{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);padding:2px 2px 6px;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab.sel{color:var(--p1);border-bottom-color:var(--p1);background:none}
.tab.sel:after{content:none}
.grid{display:grid;gap:12px}
.panel{border:1px solid rgba(91,125,179,.4);border-radius:10px;background:rgba(11,26,51,.55);padding:14px 16px}
.panel h3{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.06em;margin:0 0 6px;text-transform:uppercase;color:var(--dim)}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(5,10,20,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--bone);color:#10203a;padding:8px 16px;border-radius:99px;font-size:13px;z-index:60}
#proto{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:6px;background:#f4f1e6;color:#12203a;border-radius:99px;padding:6px 8px;box-shadow:0 6px 24px rgba(0,0,0,.55);font-size:13px;font-family:system-ui,sans-serif}
#proto button{color:#12203a;width:28px;height:28px;border-radius:50%;text-align:center;font-size:15px}
#proto button:hover{background:#dcd7c5}
#proto .lab{min-width:200px;text-align:center;font-weight:600}
#proto .sc{display:flex;gap:2px;border-left:1px solid #bbb;padding-left:8px;margin-left:4px}
#proto .sc button{width:auto;border-radius:99px;padding:4px 10px;font-size:12px}
#proto .sc button.on{background:#12203a;color:#f4f1e6}
</style>
</head>
<body>
<div id="app"></div>
<div id="proto"></div>
<script>
'use strict';
/* ———————————————————— data ———————————————————— */
const MODES = {
  daily:   { name: 'Täglich', long: 'Tägliche Herausforderung', hint: 'Nr. 19 · Blindflug · jeden Tag neu' },
  classic: { name: 'Klassisch', long: 'Klassisch', hint: 'Abwechselnd schießen, wie im Original' },
  horizon: { name: 'Ereignishorizont', long: 'Ereignishorizont', hint: 'Salven, ein wachsendes schwarzes Loch' },
  mayhem:  { name: 'Mayhem', long: 'Mayhem', hint: 'Jede Runde bringt neue Regeln' },
};
const PRESETS = {
  standard: { name: 'Standard', hint: 'Das klassische Spielerlebnis', r: { rounds: 5, planets: 4, time: 20, powerups: true,  hidden: false, trails: 0,  bounce: true } },
  sniper:   { name: 'Sniper',   hint: 'Verdeckte Bahnen, große Distanz', r: { rounds: 5, planets: 3, time: 30, powerups: false, hidden: true,  trails: 10, bounce: true } },
  party:    { name: 'Party',    hint: 'Power-ups und 8 Planeten', r: { rounds: 5, planets: 8, time: 20, powerups: true,  hidden: false, trails: 0,  bounce: true } },
  pur:      { name: 'Pur',      hint: 'Keine Extras, nur Schwerkraft', r: { rounds: 5, planets: 2, time: 20, powerups: false, hidden: false, trails: 0,  bounce: false } },
};
const QUICK = [
  { k: 'standard', mode: 'classic', preset: 'standard', name: 'Standard', hint: 'Das klassische Spielerlebnis', icon: 'classic' },
  { k: 'party',    mode: 'classic', preset: 'party',    name: 'Party',    hint: 'Power-ups, 8 Planeten, volles Programm', icon: 'mayhem' },
  { k: 'sniper',   mode: 'classic', preset: 'sniper',   name: 'Sniper',   hint: 'Verdeckte Bahnen, große Distanz', icon: 'sniper' },
  { k: 'horizon',  mode: 'horizon', preset: 'standard', name: 'Ereignishorizont', hint: 'Wachsende schwarze Löcher', icon: 'horizon' },
];
const RULES = [
  { g: 'Match', k: 'rounds', l: 'Runden', steps: [1, 3, 5, 7, 10], f: (v) => v },
  { g: 'Match', k: 'time',   l: 'Max. Flugzeit', steps: [10, 20, 30, 60], f: (v) => v + ' s' },
  { g: 'Feld',  k: 'planets', l: 'Planeten', steps: [2, 3, 4, 6, 8], f: (v) => v },
  { g: 'Feld',  k: 'bounce', l: 'Reflektierende Ränder', toggle: true },
  { g: 'Twists', k: 'powerups', l: 'Power-ups', toggle: true },
  { g: 'Twists', k: 'hidden', l: 'Verdecktes Zielen', toggle: true },
  { g: 'Twists', k: 'trails', l: 'Verblassende Spuren', steps: [0, 10, 30], f: (v) => (v ? v + ' s' : 'Aus') },
];
const CPU = ['human', 'easy', 'medium', 'hard', 'hawking'];
const CPU_NAME = { human: 'Mensch', easy: 'Kepler', medium: 'Newton', hard: 'Einstein', hawking: 'Hawking' };
const SEAT_COLOR = ['#ff8660', '#6fe3c8', '#ffd27a', '#b79cff', '#7ab8ff', '#ff7ac8'];
const VARIANTS = { A: 'Eine Seite mit Drawer', B: 'Schnellstart | Erweitert', C: 'Modus-Tabs, alles sichtbar' };

/* ———————————————————— state ———————————————————— */
const qs = new URLSearchParams(location.search);
const S = {
  variant: ['A', 'B', 'C'].includes(qs.get('variant')) ? qs.get('variant') : 'A',
  screen: qs.get('screen') === 'local' ? 'local' : 'menu',
  menuFocus: 'local',
  mode: 'classic', preset: 'standard', rules: { ...PRESETS.standard.r },
  seats: ['human', 'medium'],
  drawer: false, tab: 'quick', playing: null, toast: '',
  last: { mode: 'classic', preset: 'standard', rules: { ...PRESETS.standard.r }, seats: ['human', 'medium'] },
};

/* ———————————————————— helpers ———————————————————— */
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');
const dirty = () => Object.keys(PRESETS[S.preset].r).filter((k) => S.rules[k] !== PRESETS[S.preset].r[k]).length;
const presetLabel = () => PRESETS[S.preset].name + (dirty() ? ` +${dirty()}` : '');
function lineup(seats = S.seats) {
  const h = seats.filter((s) => s === 'human').length, c = seats.length - h;
  return [h ? `${h} ${h === 1 ? 'Mensch' : 'Menschen'}` : '', c ? `${c} CPU${c > 1 ? 's' : ''}` : ''].filter(Boolean).join(' + ');
}
function chips(cfg = S) {
  if (cfg.mode === 'daily') return ['1 Spieler', 'Feste Regeln', 'Blindflug'];
  const r = cfg.rules, out = [`${r.rounds} Runden`];
  if (cfg.mode === 'mayhem') out.push('Stärke 2', r.time + ' s');
  else out.push(`${r.planets} Planeten`, r.time + ' s', r.powerups ? 'Power-ups an' : 'Power-ups aus');
  if (cfg.mode !== 'mayhem') { if (r.hidden) out.push('Verdecktes Zielen'); if (r.trails) out.push('Spuren ' + r.trails + ' s'); }
  out.push(lineup(cfg.seats));
  return out;
}
const chipHtml = (list) => list.map((c) => `<span class="chip">${c}</span>`).join('');
const snapshot = () => ({ mode: S.mode, preset: S.preset, rules: { ...S.rules }, seats: [...S.seats] });
function icon(kind) {
  const base = 'viewBox="0 0 120 56" fill="none" stroke="currentColor" stroke-width="1.6"';
  const svg = {
    classic: `<svg ${base}><ellipse cx="60" cy="28" rx="46" ry="18" opacity=".55"/><circle cx="60" cy="28" r="9" fill="currentColor" fill-opacity=".25"/><circle cx="106" cy="28" r="3" fill="var(--p1)" stroke="none"/><path d="M14 40l9-4-3 8z" fill="var(--p1)" stroke="none"/></svg>`,
    horizon: `<svg ${base}><ellipse cx="60" cy="28" rx="46" ry="14" opacity=".35"/><ellipse cx="60" cy="28" rx="32" ry="10" opacity=".55"/><circle cx="60" cy="28" r="11" fill="#02060d" stroke="var(--sodium)"/></svg>`,
    mayhem: `<svg ${base}><path d="M60 6l5 14 14-3-9 11 12 8-15 1 1 15-8-12-9 12 0-15-15-2 12-8-8-11 14 3z" stroke="var(--p1)" fill="var(--p1)" fill-opacity=".2"/><circle cx="20" cy="14" r="3" opacity=".6"/><circle cx="100" cy="44" r="4" opacity=".6"/></svg>`,
    daily: `<svg ${base}><circle cx="60" cy="28" r="22" opacity=".4"/><circle cx="60" cy="28" r="14" opacity=".7"/><circle cx="60" cy="28" r="5" fill="var(--p1)" stroke="none"/><path d="M60 28L96 8" stroke="var(--p1)"/></svg>`,
    sniper: `<svg ${base}><circle cx="60" cy="28" r="18" stroke="var(--p2)"/><path d="M60 4v14M60 38v14M36 28h14M70 28h14" stroke="var(--p2)"/><circle cx="104" cy="14" r="6" fill="currentColor" fill-opacity=".25"/></svg>`,
  };
  return svg[kind];
}
const shipSvg = (color) => `<svg viewBox="0 0 30 30"><path d="M15 3l7 20-7-4-7 4z" fill="${color}"/></svg>`;
const key = (k) => `data-k="${k}"`;

function applyPreset(p) { S.preset = p; S.rules = { ...PRESETS[p].r }; }
function applyCfg(c) { S.mode = c.mode; S.preset = c.preset; S.rules = { ...c.rules }; S.seats = [...c.seats]; }
function start() {
  S.last = snapshot();
  S.playing = { title: MODES[S.mode].long, chips: chips() };
  S.drawer = false;
}
function toast(msg) { S.toast = msg; render(); clearTimeout(toast.t); toast.t = setTimeout(() => { S.toast = ''; render(); }, 1800); }

/* ———————————————————— shared pieces ———————————————————— */
function seatsHtml(prefix = 's') {
  const items = S.seats.map((s, i) => `<div style="position:relative"><button class="seat" ${key(prefix + i)} data-select data-row="seats" data-act="seat:${i}" title="Tippen: Mensch ↔ CPU-Stufe">${shipSvg(SEAT_COLOR[i])}<span>${CPU_NAME[s]}</span></button>${S.seats.length > 2 ? `<button class="seatx" ${key(prefix + 'x' + i)} data-act="seatx:${i}" aria-label="Entfernen">×</button>` : ''}</div>`);
  if (S.seats.length < 6) items.push(`<button class="seat add" ${key(prefix + 'add')} data-act="seatadd" aria-label="Spieler hinzufügen">+</button>`);
  return `<div class="row wrap" style="align-items:flex-start">${items.join('')}</div>`;
}
function rulesHtml(groups, pre = 'r') {
  return groups.map((g) => `<div style="margin-bottom:14px"><div class="lbl">${g}</div>${RULES.filter((r) => r.g === g).map((r) => {
    if (r.toggle) return `<div class="ctl"><span>${r.l}</span><button class="sw ${S.rules[r.k] ? 'on' : ''}" ${key(pre + r.k)} data-act="toggle:${r.k}" role="switch" aria-checked="${!!S.rules[r.k]}" aria-label="${r.l}"></button></div>`;
    return `<div class="ctl"><span>${r.l}</span><div class="seg">${r.steps.map((v) => `<button class="${S.rules[r.k] === v ? 'sel' : ''}" ${key(pre + r.k + v)} data-select data-row="${pre}-${r.k}" data-act="rule:${r.k}:${v}">${r.f(v)}</button>`).join('')}</div></div>`;
  }).join('')}</div>`).join('');
}
const presetStrip = (pre = 'p') => `<div class="row wrap" style="align-items:center">${Object.entries(PRESETS).map(([k, p]) => `<button class="card nocheck ${S.preset === k ? 'sel' : ''}" style="padding:8px 16px;flex-direction:row;gap:8px;align-items:center" ${key(pre + k)} data-select data-row="${pre}" data-act="preset:${k}"><span style="font-size:14px;font-weight:700">${p.name}</span></button>`).join('')}${dirty() ? `<span class="chip dirty">${presetLabel()}</span>` : ''}</div>`;
const startBtn = (k = 'start') => `<button class="cta" ${key(k)} data-act="start">Spiel starten <span style="font-size:20px">»</span></button>`;
const dailyPanel = () => `<div class="panel"><h3>Heute · Nr. 19</h3><p style="margin:4px 0 10px;font-size:14px;line-height:1.55">Blindflug: Die Planeten sind unsichtbar, ein Flug pro Versuch. Gleiche Welt für alle, jeden Tag neu.</p><div class="row wrap"><span class="chip">Noch nicht gespielt</span><span class="chip">Serie: 4 Tage</span><span class="chip">Bestzeit: –</span></div><div style="margin-top:12px"><button class="ghost" ${key('lb')} data-act="soon:Rangliste">Rangliste ansehen ›</button></div></div>`;
const modeCard = (m, pre = 'm', big = false) => `<button class="card ${S.mode === m ? 'sel' : ''}" ${key(pre + m)} data-select data-row="${pre}" data-act="mode:${m}">${icon(m === 'daily' ? 'daily' : m)}<span class="n">${big ? MODES[m].long : MODES[m].name}</span><span class="h">${MODES[m].hint}</span></button>`;
const back = (to = 'menu') => `<button class="crumb" ${key('back')} data-act="screen:${to}">‹ Zurück</button>`;
const langFoot = '<span class="muted" style="font-size:12px">Sprache ‹ Deutsch ›</span>';

/* ———————————————————— main menu panes (focus-driven) ———————————————————— */
const MENU = [
  { k: 'local', l: 'Lokal', hint: '1–6 Spieler an diesem Gerät' },
  { k: 'online', l: 'Online', hint: 'Räume, bis zu sechs' },
  { k: 'help', l: 'Anleitung' },
  { k: 'settings', l: 'Einstellungen' },
];
function teaser(k) {
  if (k === 'online') return `<div class="panel"><h3>Online</h3><p style="margin:0 0 10px;font-size:14px">Offene Räume (Beispieldaten)</p><div class="row wrap"><span class="chip">Raum von Anna · Klassisch · 3/6</span><span class="chip">Feierabendrunde · Mayhem · 2/4</span></div><p class="muted" style="font-size:12px;margin:12px 0 0">Die Lobby ist nicht Teil dieses Prototyps.</p></div>`;
  if (k === 'help') return `<div class="panel"><h3>Anleitung</h3><p style="margin:0;font-size:14px;line-height:1.55">Schwerkraft lesen, Bahn merken, Treffer setzen.</p></div>`;
  return `<div class="panel"><h3>Einstellungen</h3><p style="margin:0;font-size:14px">Vollbild, Ton, Sprache.</p></div>`;
}
function onlineCards() {
  const c = (id, ic, n, h) => `<button class="card big" ${key('o' + id)} data-act="soon:${n}">${ic}<span class="n">${n}</span><span class="h">${h}</span></button>`;
  const base = 'viewBox="0 0 120 56" fill="none" stroke="currentColor" stroke-width="1.6"';
  return `<div class="grid bigs" style="grid-template-columns:repeat(3,minmax(0,1fr))">
  ${c('join', `<svg ${base}><circle cx="78" cy="28" r="16" opacity=".5"/><circle cx="78" cy="28" r="7" fill="currentColor" fill-opacity=".3"/><path d="M16 28h38M46 20l8 8-8 8" stroke="var(--p1)"/></svg>`, 'Schnell beitreten', 'Springt in den vollsten offenen Raum')}
  ${c('room', `<svg ${base}><rect x="40" y="6" width="40" height="44" rx="6" opacity=".6"/><path d="M60 18v20M50 28h20" stroke="var(--p1)"/></svg>`, 'Raum erstellen', 'Eigene Regeln, öffentlich oder privat')}
  ${c('code', `<svg ${base}><rect x="22" y="16" width="76" height="24" rx="6" opacity=".6"/><circle cx="44" cy="28" r="3" fill="var(--p1)" stroke="none"/><circle cx="60" cy="28" r="3" fill="var(--p1)" stroke="none"/><circle cx="76" cy="28" r="3" fill="var(--p1)" stroke="none"/></svg>`, 'Code eingeben', 'Privaten Raum betreten')}</div>
  <p class="muted" style="font-size:12px;margin:0">Die Lobby ist nicht Teil dieses Prototyps.</p>`;
}
function paneA(k) {
  if (k === 'online') return onlineCards();
  if (k !== 'local') return teaser(k);
  return `<div class="grid bigs">${['daily', 'classic', 'horizon', 'mayhem'].map((m) => `<button class="card big ${S.mode === m ? 'sel' : ''}" ${key('mm' + m)} data-select data-row="mm" data-act="mode:${m}">${icon(m)}<span class="n">${MODES[m].long}</span><span class="h">${MODES[m].hint}</span></button>`).join('')}</div>
  <div class="panel row wrap" style="justify-content:space-between;align-items:center;padding:10px 14px"><div class="row wrap">${chipHtml(chips())}</div><div class="row" style="align-items:center"><button class="ghost" ${key('adjust')} data-act="screen:local">Anpassen ›</button><button class="cta" style="font-size:22px;padding:8px 22px 6px" ${key('mstart')} data-act="start">Spiel starten »</button></div></div>`;
}
function paneB(k) {
  if (k === 'online') return onlineCards();
  if (k !== 'local') return teaser(k);
  return `<div class="grid bigs">${QUICK.map((q) => `<button class="card big" ${key('q' + q.k)} data-act="quickstart:${q.k}">${icon(q.icon)}<span class="n">${q.name}</span><span class="h">${q.hint}</span></button>`).join('')}</div>
  <div class="row" style="justify-content:space-between;align-items:center"><button class="ghost" ${key('daily')} data-act="daily">Tägliche Herausforderung Nr. 19 ›</button><button class="ghost" ${key('more')} data-act="screen:local">Mehr Optionen ›</button></div>`;
}
function paneC(k) {
  if (k === 'online') return onlineCards();
  if (k !== 'local') return teaser(k);
  return `<div class="grid bigs">${['daily', 'classic', 'horizon', 'mayhem'].map((m) => `<button class="card big" ${key('mc' + m)} data-act="pickmode:${m}">${icon(m)}<span class="n">${MODES[m].long}</span><span class="h">${MODES[m].hint}</span></button>`).join('')}</div>
  <p class="muted" style="font-size:12px;margin:0">Ein Klick öffnet die Einstellungen dieses Modus.</p>`;
}
function menuScreen() {
  const pane = { A: paneA, B: paneB, C: paneC }[S.variant];
  return `<div class="screen"><div class="eyebrow">Gravitationsduell für zwei bis sechs</div><h1 class="wordmark">Slingshot</h1>
  <p class="lede">Raumschiffe, dazwischen Planeten. Jeder Schuss folgt der Schwerkraft – lies deine alten Bahnen und tast dich an den Treffer heran.</p>
  <div class="cols"><nav class="menu">${MENU.map((m) => `<button class="mi ${S.menuFocus === m.k ? 'on' : ''}" ${key('mi' + m.k)} data-menu="${m.k}" data-act="menu:${m.k}">${m.l}${m.hint ? `<small>${m.hint}</small>` : ''}</button>`).join('')}</nav>
  <div class="pane" id="pane">${pane(S.menuFocus)}</div></div>
  <div class="row" style="justify-content:space-between;margin-top:auto;padding-top:24px"><p class="keys" style="margin:0;padding:0"><kbd>↑ ↓ ← →</kbd> bewegen · <kbd>Enter</kbd> bestätigen · <kbd>Esc</kbd> zurück</p>${langFoot}</div></div>`;
}

/* ———————————————————— local screens ———————————————————— */
function localA() {
  const daily = S.mode === 'daily';
  return `<div class="screen">${back()}<h2 class="h2">Lokal spielen</h2>
  <div style="margin-top:18px"><div class="lbl">Modus</div><div class="row">
    <div style="width:clamp(130px,16vw,190px)">${modeCard('daily')}</div><div style="width:1px;background:rgba(91,125,179,.5);margin:4px 2px"></div>
    <div class="grid grow" style="grid-template-columns:repeat(3,minmax(0,1fr))">${['classic', 'horizon', 'mayhem'].map((m) => modeCard(m)).join('')}</div></div></div>
  ${daily ? `<div style="margin-top:18px">${dailyPanel()}</div>` : `
  <div style="margin-top:18px"><div class="lbl">Regeln</div><div class="row wrap" style="justify-content:space-between;align-items:center">${presetStrip()}<button class="ghost" ${key('adjust')} data-act="drawer:1">Regeln anpassen ›</button></div></div>
  <div style="margin-top:18px"><div class="lbl">Besatzung</div>${seatsHtml()}<p class="muted" style="font-size:12px;margin:8px 0 0">Tippen wechselt Mensch und CPU-Stufe · × nimmt ein Schiff heraus</p></div>`}
  <div class="bar" style="border-top:1px solid rgba(91,125,179,.3)"><div class="row wrap">${chipHtml(chips())}</div>${startBtn()}</div>
  <p class="keys" style="margin:0;padding-top:10px"><kbd>↑ ↓</kbd> Bereich · <kbd>← →</kbd> wählen · <kbd>Enter</kbd> startet immer · <kbd>Esc</kbd> zurück</p></div>
  ${S.drawer ? `<div class="scrim" data-act="drawer:0"></div><aside class="drawer" role="dialog" aria-label="Regeln anpassen"><div class="row" style="justify-content:space-between;align-items:center;margin-bottom:6px"><h2 class="h2" style="font-size:32px">Regeln</h2><button class="ghost" ${key('dclose')} data-act="drawer:0">Fertig</button></div><p class="muted" style="font-size:12px;margin:0 0 14px">Basis: ${presetLabel()}</p>${rulesHtml(['Match', 'Feld', 'Twists'], 'd')}${dirty() ? `<button class="ghost" ${key('dreset')} data-act="preset:${S.preset}">Auf ${PRESETS[S.preset].name} zurücksetzen</button>` : ''}</aside>` : ''}`;
}
function localB() {
  const cur = QUICK.find((q) => q.mode === S.mode && q.preset === S.preset && !dirty());
  const quick = `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">${QUICK.map((q) => `<button class="card ${cur === q ? 'sel' : ''}" style="padding:16px" ${key('q' + q.k)} data-select data-row="quick" data-act="quicksel:${q.k}">${icon(q.icon)}<span class="n" style="font-size:26px">${q.name}</span><span class="h">${q.hint}</span></button>`).join('')}</div>
  <div class="row" style="margin-top:14px;align-items:center"><button class="card ${S.mode === 'daily' ? 'sel' : ''}" ${key('qdaily')} data-select data-row="quick2" data-act="mode:daily" style="flex-direction:row;gap:12px;align-items:center;padding:10px 16px"><span class="n" style="font-size:20px">Tägliche Herausforderung</span><span class="h">Nr. 19 · Blindflug</span></button></div>`;
  const adv = `<div class="cols" style="gap:28px"><div class="grow"><div class="lbl">Modus</div><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">${['classic', 'horizon', 'mayhem', 'daily'].map((m) => modeCard(m, 'am')).join('')}</div><div class="lbl" style="margin-top:18px">Besatzung</div>${S.mode === 'daily' ? '<p class="muted" style="font-size:13px">Die Tagesherausforderung spielt man allein.</p>' : seatsHtml()}</div>
  <div class="grow">${S.mode === 'daily' ? dailyPanel() : `<div class="lbl">Vorlage</div>${presetStrip('ap')}<div style="margin-top:14px">${rulesHtml(['Match', 'Feld', 'Twists'], 'a')}</div>`}</div></div>`;
  return `<div class="screen">${back()}<div class="eyebrow">Gravitationsduell für zwei bis sechs</div><h2 class="h2">Spiel-Einstellungen</h2>
  <div class="tabs" role="tablist">${[['quick', 'Schnellstart'], ['adv', 'Erweitert']].map(([k, l]) => `<button class="tab ${S.tab === k ? 'sel' : ''}" role="tab" ${key('t' + k)} data-select data-row="tabs" data-act="tab:${k}">${l}</button>`).join('')}</div>
  <div>${S.tab === 'quick' ? quick : adv}</div>
  <div class="bar"><div class="row wrap">${chipHtml(chips())}</div>${startBtn()}</div></div>`;
}
function localC() {
  const daily = S.mode === 'daily';
  const seatRows = S.seats.map((s, i) => `<div class="ctl"><span class="row" style="align-items:center;gap:8px"><span style="display:inline-block;width:20px;height:20px">${shipSvg(SEAT_COLOR[i])}</span>Schiff ${i + 1}</span><div class="row" style="align-items:center"><div class="seg"><button class="${s === 'human' ? 'sel' : ''}" ${key('cs' + i + 'h')} data-select data-row="cs${i}" data-act="seatset:${i}:human">Mensch</button><button class="${s !== 'human' ? 'sel' : ''}" ${key('cs' + i + 'c')} data-select data-row="cs${i}" data-act="seatset:${i}:${s === 'human' ? 'medium' : s}">${s === 'human' ? 'CPU' : CPU_NAME[s]}</button></div>${S.seats.length > 2 ? `<button class="ghost" style="padding:2px 8px" ${key('cx' + i)} data-act="seatx:${i}" aria-label="Entfernen">×</button>` : ''}</div></div>`).join('');
  return `<div class="screen">${back()}
  <div class="row" style="align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px"><div><div class="eyebrow">Gravitationsduell für zwei bis sechs</div><h2 class="h2">${MODES[S.mode].long} <span class="muted">· Einstellungen</span></h2></div></div>
  <div class="grid" style="grid-template-columns:repeat(4,minmax(0,1fr));margin:16px 0">${['daily', 'classic', 'horizon', 'mayhem'].map((m) => `<button class="card ${S.mode === m ? 'sel' : ''}" style="flex-direction:row;align-items:center;gap:12px;padding:8px 14px" ${key('cm' + m)} data-select data-row="cm" data-act="mode:${m}"><span style="width:64px;flex:none">${icon(m)}</span><span class="n" style="font-size:18px">${MODES[m].name}</span></button>`).join('')}</div>
  ${daily ? dailyPanel() : `<div class="row wrap" style="align-items:center;margin-bottom:12px"><span class="muted" style="font-size:12px;letter-spacing:.15em">VORLAGE</span>${presetStrip('cp')}</div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr));align-items:start">
    <div class="panel"><h3>Spiel</h3>${rulesHtml(['Match', 'Feld'], 'c')}</div>
    <div class="panel"><h3>Extras</h3>${rulesHtml(['Twists'], 'c')}</div>
    <div class="panel"><h3>Besatzung</h3>${seatRows}${S.seats.length < 6 ? `<div style="margin-top:10px"><button class="ghost" ${key('cadd')} data-act="seatadd">+ Schiff hinzufügen</button></div>` : ''}</div></div>`}
  <div class="bar"><span class="muted" style="font-size:12px"><kbd style="font-family:inherit;font-weight:700;color:var(--bone)">Enter</kbd> startet immer · <kbd style="font-family:inherit;font-weight:700;color:var(--bone)">Esc</kbd> zurück</span>${startBtn()}</div></div>`;
}

/* ———————————————————— render ———————————————————— */
function render() {
  const focusKey = document.activeElement?.dataset?.k;
  const scroll = app.scrollTop;
  app.innerHTML = (S.screen === 'menu' ? menuScreen() : { A: localA, B: localB, C: localC }[S.variant]())
    + (S.playing ? `<div class="overlay"><div class="eyebrow">Prototyp · hier würde das Spiel beginnen</div><h2 class="h2" style="font-size:64px">${S.playing.title}</h2><div class="row wrap" style="justify-content:center">${chipHtml(S.playing.chips)}</div><button class="ghost" ${key('ov')} data-act="closeplay">Zurück zum Menü (Esc)</button></div>` : '')
    + (S.toast ? `<div class="toast">${S.toast}</div>` : '');
  app.scrollTop = scroll;
  const target = (focusKey && app.querySelector(`[data-k="${CSS.escape(focusKey)}"]`)) || (S.playing && $('[data-k=ov]'));
  if (target) target.focus({ preventScroll: true });
  else if (!document.activeElement || document.activeElement === document.body) {
    const first = S.screen === 'menu' ? app.querySelector('[data-k=mi' + S.menuFocus + ']') : app.querySelector('.cta');
    first?.focus({ preventScroll: true });
  }
  renderBar();
}
function renderBar() {
  $('#proto').innerHTML = `<button data-pv="-1" aria-label="Vorige Variante">←</button><span class="lab">${S.variant} · ${VARIANTS[S.variant]}</span><button data-pv="1" aria-label="Nächste Variante">→</button><span class="sc"><button class="${S.screen === 'menu' ? 'on' : ''}" data-ps="menu">Hauptmenü</button><button class="${S.screen === 'local' ? 'on' : ''}" data-ps="local">Lokal</button></span>`;
  const u = new URL(location.href); u.searchParams.set('variant', S.variant); u.searchParams.set('screen', S.screen);
  try { history.replaceState(null, '', u); } catch (e) { /* file:// in some browsers */ }
}
function setVariant(v) { S.variant = v; S.drawer = false; render(); }
function cycle(d) { const ks = Object.keys(VARIANTS); setVariant(ks[(ks.indexOf(S.variant) + d + ks.length) % ks.length]); }

/* ———————————————————— actions ———————————————————— */
function act(a, el) {
  const [name, x, y] = a.split(':');
  switch (name) {
    case 'screen': S.screen = x; S.drawer = false; document.activeElement?.blur(); break;
    case 'menu':
      if (x === 'local') { S.screen = 'local'; S.tab = 'quick'; document.activeElement?.blur(); }
      else { toast('Nicht Teil dieses Prototyps: ' + MENU.find((m) => m.k === x).l); return; }
      break;
    case 'resume': applyCfg(S.last); start(); break;
    case 'daily': S.mode = 'daily'; start(); break;
    case 'quickstart': { const q = QUICK.find((c) => c.k === x); S.mode = q.mode; applyPreset(q.preset); start(); break; }
    case 'quicksel': { const q = QUICK.find((c) => c.k === x); S.mode = q.mode; applyPreset(q.preset); break; }
    case 'pickmode': S.mode = x; S.screen = 'local'; document.activeElement?.blur(); break;
    case 'mode': S.mode = x; break;
    case 'preset': applyPreset(x); break;
    case 'rule': S.rules[x] = Number(y); break;
    case 'toggle': S.rules[x] = !S.rules[x]; break;
    case 'seat': { const i = Number(x); S.seats[i] = CPU[(CPU.indexOf(S.seats[i]) + 1) % CPU.length]; break; }
    case 'seatset': S.seats[Number(x)] = y; break;
    case 'seatx': S.seats.splice(Number(x), 1); break;
    case 'seatadd': S.seats.push('medium'); break;
    case 'drawer': S.drawer = x === '1'; if (!S.drawer) document.activeElement?.blur(); break;
    case 'tab': S.tab = x; break;
    case 'start': start(); break;
    case 'closeplay': S.playing = null; break;
    case 'soon': toast('Nicht Teil dieses Prototyps: ' + x); return;
  }
  render();
}
document.addEventListener('click', (e) => {
  const pv = e.target.closest('[data-pv]'); if (pv) return cycle(Number(pv.dataset.pv));
  const ps = e.target.closest('[data-ps]'); if (ps) { S.screen = ps.dataset.ps; S.drawer = false; S.playing = null; return render(); }
  const el = e.target.closest('[data-act]'); if (el && app.contains(el)) act(el.dataset.act, el);
});

/* focus on a menu entry updates the pane on the right, without redrawing the list */
function menuFocus(k) {
  if (S.screen !== 'menu' || S.menuFocus === k) return;
  S.menuFocus = k;
  const pane = { A: paneA, B: paneB, C: paneC }[S.variant];
  $('#pane').innerHTML = pane(k);
  app.querySelectorAll('.mi').forEach((m) => m.classList.toggle('on', m.dataset.menu === k));
}
app.addEventListener('focusin', (e) => { const m = e.target.closest?.('[data-menu]'); if (m) menuFocus(m.dataset.menu); });
app.addEventListener('mouseover', (e) => { const m = e.target.closest?.('[data-menu]'); if (m) menuFocus(m.dataset.menu); });

/* ———————————————————— keyboard: arrows move in space, Enter starts ———————————————————— */
function move(dir) {
  const scope = S.drawer ? $('.drawer') : app;
  const els = [...scope.querySelectorAll('[data-k]')].filter((e) => e.offsetParent !== null);
  const cur = document.activeElement;
  if (!els.includes(cur)) return els[0]?.focus();
  const c = cur.getBoundingClientRect(), cx = c.left + c.width / 2, cy = c.top + c.height / 2;
  const horiz = dir === 'ArrowLeft' || dir === 'ArrowRight';
  let best = null, bs = Infinity;
  for (const e of els) {
    if (e === cur) continue;
    const r = e.getBoundingClientRect(), x = r.left + r.width / 2 - cx, y = r.top + r.height / 2 - cy;
    const main = dir === 'ArrowRight' ? x : dir === 'ArrowLeft' ? -x : dir === 'ArrowDown' ? y : -y;
    if (main < 6) continue;
    // ←/→ stay on the same line; ↑/↓ may drift sideways
    if (horiz && Math.abs(y) > Math.max(c.height, r.height) * 0.6) continue;
    const cross = horiz ? Math.abs(y) : Math.abs(x);
    const s = main + cross * 2.2;
    if (s < bs) { bs = s; best = e; }
  }
  if (!best) return;
  // moving into another strip lands on what is selected there, not on whatever is nearest
  if (best.dataset.row && best.dataset.row !== cur.dataset.row) {
    const picked = [...els].find((e) => e.dataset.row === best.dataset.row && e.classList.contains('sel'));
    if (picked) best = picked;
  }
  const sameRow = horiz && cur.dataset.row && best.dataset.row === cur.dataset.row;
  best.focus();
  best.scrollIntoView({ block: 'nearest' });
  if (sameRow && best.dataset.select !== undefined) best.click();
}
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (S.playing) { if (e.key === 'Escape' || e.key === 'Enter') { e.preventDefault(); S.playing = null; render(); } return; }
  if (['1', '2', '3'].includes(e.key)) return setVariant('ABC'[Number(e.key) - 1]);
  if (e.key === '[') return cycle(-1);
  if (e.key === ']') return cycle(1);
  if (e.key.startsWith('Arrow')) { e.preventDefault(); return move(e.key); }
  if (e.key === 'Escape') {
    if (S.drawer) { S.drawer = false; render(); } else if (S.screen === 'local') { S.screen = 'menu'; render(); }
    return;
  }
  if (e.key === 'Enter' && !S.drawer) {
    const t = document.activeElement;
    if (t && t.dataset.select !== undefined && (S.screen === 'local' || t.dataset.row === 'mm')) { e.preventDefault(); start(); render(); }
  }
});
render();
</script>
