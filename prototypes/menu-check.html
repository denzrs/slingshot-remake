<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slingshot · Menüprüfung</title>
<style>
#checks{position:fixed;z-index:30;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;width:max-content;max-width:96%;padding:6px 12px;background:#142641;border:1px solid #5b7db3;border-radius:4px;font:11px system-ui;color:#e8e4d8}
#checks button{padding:6px 9px;border:1px solid #5b7db3;background:#081426;color:#e8e4d8;border-radius:3px;cursor:pointer}
.screen--menu-page{padding-top:62px!important}
</style>
<div id="checks"><span>VORSCHAU · TESTDATEN</span><button data-screen="results">Endstand</button><button data-screen="daily">Daily-Ergebnis</button><button data-screen="board">Bestenliste</button><button data-screen="pause">Pause</button></div>
<div id="overlay"></div>
<script type="module">
// Local visual QA only. Vite's production entry is index.html; this page is not bundled.
import '@fontsource/big-shoulders-stencil-display/800';
import '@fontsource/b612/400';
import '@fontsource/b612/700';
import '@fontsource/b612-mono/400';
import '@fontsource/b612-mono/700';
import '/src/style.css';
import '/src/ui/launcher.css';
import '/src/ui/menu-page.css';
import { Sound } from '/src/audio.ts';
import { Menu } from '/src/ui/menu.ts';
import { gameOverScreen, pauseScreen } from '/src/ui/screens.ts';
import { dailyResultScreen } from '/src/ui/daily.ts';
import { leaderboardScreen } from '/src/ui/leaderboard.ts';
import { DEFAULT_SETTINGS, cloneSettings } from '/src/settings.ts';
import { createMatch, createChallenge } from '/src/game/index.ts';
import { dailyChallenge, dateKey } from '/src/challenge.ts';
import { setLang } from '/src/i18n.ts';
setLang('de');
const sound = new Sound(); sound.enabled = false;
const menu = new Menu(document.querySelector('#overlay'), sound);
const settings = cloneSettings(DEFAULT_SETTINGS);
const app = { menu, settings, mode:'classic', mayhem:false, online:false, today:dateKey,
 settingsChanged(){setLang(settings.language);menu.rebuild();}, start(){show('pause');}, startDaily(){show('daily');},
 openLobby(){location.href='/';}, toLobby(){location.href='/';}, resume(){location.href='/';}, rematch(){location.href='/';}, toTitle(){location.href='/';},
 toggleFullscreen(){}, isFullscreen(){return false;},
};
const match = createMatch('classic', cloneSettings(settings), {seed:42});
match.phase='gameOver'; match.round=5;
match.players[0].score=420; match.players[1].score=285;
match.scoreHistory=[[0,0],[100,50],[180,130],[220,200],[350,240],[420,285]];
const daily = createChallenge(cloneSettings(settings), dailyChallenge(dateKey()));
daily.pilot.score=1000;
daily.results=daily.challenge.sectors.map((sector,i)=>({index:i,targets:sector.targets,budget:sector.shots,cleared:true,shots:[{kind:'hit',points:100+i*50,combo:[],multiplier:1}],points:100+i*50,bonus:0}));
const outcome={record:{best:1000,attempts:3},newBest:true,streak:4};
const views={results:()=>gameOverScreen(app,match),daily:()=>dailyResultScreen(app,daily,outcome),board:()=>leaderboardScreen(app,dateKey(),'Tägliche Herausforderung',null),pause:()=>pauseScreen(app)};
function show(screen){menu.open(views[screen]??views.results);}
for(const button of document.querySelectorAll('[data-screen]')) button.addEventListener('click',()=>show(button.dataset.screen));
window.addEventListener('keydown',e=>{if(menu.handleKey(e))e.preventDefault();});
show(new URLSearchParams(location.search).get('screen')??'results');
</script>
</html>
