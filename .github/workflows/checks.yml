name: Slingshot checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache-workspaces: server
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: npm run news:validate
      - run: npm run typecheck
      - run: npm run build
      - run: cargo fmt --manifest-path server/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path server/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path server/Cargo.toml
      - run: npm test

