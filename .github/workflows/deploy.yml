name: Slingshot CI, Deploy & Release

# Merges to main are tested, deployed to Pages, and released automatically. v* tags are
# released as-is without restarting the multiplayer relay.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'Stage VPS bootstrap files (run once; then execute the staged script with sudo on the VPS)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Release and production-deployment runs queue up one after another. Only a superseded run of the
# same pull request is cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'main-line' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # A bootstrap-only dispatch provisions the server without running the whole suite.
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.bootstrap == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache-workspaces: server
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: cargo fmt --manifest-path server/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path server/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path server/Cargo.toml
      - run: npm test

  server-x86_64:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: x86_64-unknown-linux-musl
          cache-workspaces: server
          components: rustfmt, clippy
      - name: Build the relay for x86_64 (static musl)
        working-directory: server
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          cargo build --locked --release --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-x86_64
          path: server/target/x86_64-unknown-linux-musl/release/slingshot-server

  relay-changes:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch || "$BEFORE" =~ ^0+$ ]] || git diff --name-only "$BEFORE" "$GITHUB_SHA" | awk 'BEGIN { found = 0 } /^server\// || /^deploy\/ionos\// || /^\.github\/workflows\/deploy\.yml$/ { found = 1 } END { exit !found }'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

  push-server-setup:
    name: Stage server setup files
    # From the Actions tab with the bootstrap checkbox: stages setup files in a private
    # directory under /srv/slingshot. Review them and run the script manually as root.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.bootstrap == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ionos-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Copy deploy/ionos/ to the server
        env:
          SSH_KEY: ${{ secrets.IONOS_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.IONOS_DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.IONOS_SERVER_IP }}
          DEPLOY_USER: ${{ vars.IONOS_DEPLOY_USER }}
        run: |
          set -euo pipefail
          DEPLOY_USER="${DEPLOY_USER:-ops}"
          missing=()
          for name in SSH_KEY KNOWN_HOSTS HOST; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          ((${#missing[@]} == 0)) || { printf 'Missing settings: %s\n' "${missing[*]}" >&2; exit 1; }
          install -m 0700 -d "$RUNNER_TEMP/ionos-ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/ionos-ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/ionos-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/ionos-ssh/id_ed25519" "$RUNNER_TEMP/ionos-ssh/known_hosts"
          ssh_options=(-i "$RUNNER_TEMP/ionos-ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ionos-ssh/known_hosts")
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$HOST" "install -d -m 0700 /srv/slingshot/ionos-setup"
          scp "${ssh_options[@]}" deploy/ionos/setup-server.sh deploy/ionos/slingshot-relay.service deploy/ionos/renewal-deploy.sh \
            "$DEPLOY_USER@$HOST:/srv/slingshot/ionos-setup/"

  deploy-relay:
    name: Deploy multiplayer relay
    # Deploy relay changes on main or by explicit dispatch from main only.
    # Never restart on feature branches, tags, or frontend-only pushes.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.relay-changes.outputs.changed == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.inputs.bootstrap != 'true')
    needs: [test, server-x86_64, relay-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ionos-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: server-x86_64
          path: server/target/x86_64-unknown-linux-musl/release

      - name: Copy relay files over SSH and restart the user service
        env:
          DEPLOY_SSH_KEY: ${{ secrets.IONOS_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.IONOS_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.IONOS_SERVER_IP }}
          DEPLOY_USER: ${{ vars.IONOS_DEPLOY_USER }}
          RELAY_PORT: ${{ vars.RELAY_PORT }}
          RELAY_ALLOWED_ORIGINS: ${{ vars.RELAY_ALLOWED_ORIGINS }}
          RELAY_MAX_CONNECTIONS: ${{ vars.RELAY_MAX_CONNECTIONS }}
          RELAY_MAX_CONNECTIONS_PER_IP: ${{ vars.RELAY_MAX_CONNECTIONS_PER_IP }}
          RELAY_CONNECTIONS_PER_IP_PER_SECOND: ${{ vars.RELAY_CONNECTIONS_PER_IP_PER_SECOND }}
          RELAY_MAX_MESSAGES_PER_SECOND: ${{ vars.RELAY_MAX_MESSAGES_PER_SECOND }}
          RELAY_TLS_CERT: /etc/letsencrypt/live/slingshot-relay.eu/fullchain.pem
          RELAY_TLS_KEY: /etc/letsencrypt/live/slingshot-relay.eu/privkey.pem
          RELAY_HEALTHCHECK_URL: ${{ vars.RELAY_HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          missing=()
          for name in DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_HOST DEPLOY_USER RELAY_ALLOWED_ORIGINS RELAY_HEALTHCHECK_URL; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          ((${#missing[@]} == 0)) || { printf 'Missing required settings: %s\n' "${missing[*]}" >&2; exit 1; }
          : "${RELAY_PORT:=8080}"
          : "${RELAY_MAX_CONNECTIONS:=1000}"
          : "${RELAY_MAX_CONNECTIONS_PER_IP:=64}"
          : "${RELAY_CONNECTIONS_PER_IP_PER_SECOND:=20}"
          : "${RELAY_MAX_MESSAGES_PER_SECOND:=300}"
          if ! [[ "$RELAY_PORT" =~ ^[1-9][0-9]{0,4}$ ]] || (( RELAY_PORT > 65535 )); then
            echo 'RELAY_PORT must be an integer from 1 to 65535' >&2
            exit 1
          fi
          for value in "$RELAY_PORT" "$RELAY_ALLOWED_ORIGINS" "$RELAY_MAX_CONNECTIONS" "$RELAY_MAX_CONNECTIONS_PER_IP" "$RELAY_CONNECTIONS_PER_IP_PER_SECOND" "$RELAY_MAX_MESSAGES_PER_SECOND" "$RELAY_HEALTHCHECK_URL"; do
            case "$value" in *$'\n'*|*$'\r'*) echo 'Multiline relay settings are not supported' >&2; exit 1;; esac
          done
          install -m 0700 -d "$RUNNER_TEMP/ionos-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ionos-ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ionos-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/ionos-ssh/id_ed25519" "$RUNNER_TEMP/ionos-ssh/known_hosts"
          {
            printf 'PORT=%s\n' "$RELAY_PORT"
            printf 'ALLOWED_ORIGINS=%s\n' "$RELAY_ALLOWED_ORIGINS"
            printf 'MAX_CONNECTIONS=%s\n' "$RELAY_MAX_CONNECTIONS"
            printf 'MAX_CONNECTIONS_PER_IP=%s\n' "$RELAY_MAX_CONNECTIONS_PER_IP"
            printf 'CONNECTIONS_PER_IP_PER_SECOND=%s\n' "$RELAY_CONNECTIONS_PER_IP_PER_SECOND"
            printf 'MAX_MESSAGES_PER_SECOND=%s\n' "$RELAY_MAX_MESSAGES_PER_SECOND"
            [[ -z "$RELAY_TLS_CERT" ]] || printf 'TLS_CERT=%s\n' "$RELAY_TLS_CERT"
            [[ -z "$RELAY_TLS_KEY" ]] || printf 'TLS_KEY=%s\n' "$RELAY_TLS_KEY"
          } > "$RUNNER_TEMP/relay.env"
          ssh_options=(-i "$RUNNER_TEMP/ionos-ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ionos-ssh/known_hosts")
          scp "${ssh_options[@]}" \
            server/target/x86_64-unknown-linux-musl/release/slingshot-server \
            "$DEPLOY_USER@$DEPLOY_HOST:/srv/slingshot/slingshot-server.new"
          scp "${ssh_options[@]}" \
            "$RUNNER_TEMP/relay.env" "$DEPLOY_USER@$DEPLOY_HOST:/srv/slingshot/relay.env.new"
          remote_deploy='
            set -e
            export XDG_RUNTIME_DIR="/run/user/$(id -u)"
            rm -f slingshot-server.prev relay.env.prev
            [ ! -e slingshot-server ] || mv slingshot-server slingshot-server.prev
            [ ! -e relay.env ] || mv relay.env relay.env.prev
            mv slingshot-server.new slingshot-server
            mv relay.env.new relay.env
            chmod 0755 slingshot-server
            chmod 0640 relay.env
            systemctl --user daemon-reload
            systemctl --user reset-failed slingshot-relay.service 2>/dev/null || true
            systemctl --user restart slingshot-relay.service
            for attempt in {1..10}; do
              if systemctl --user is-active --quiet slingshot-relay.service; then
                echo "Relay is active."
                exit 0
              fi
              sleep 2
            done
            if ! systemctl --user is-active --quiet slingshot-relay.service; then
              systemctl --user status slingshot-relay.service --no-pager || true
            fi
            exit 1
          '
          remote_rollback='
            set -e
            export XDG_RUNTIME_DIR="/run/user/$(id -u)"
            [ ! -e slingshot-server ] || mv slingshot-server slingshot-server.failed
            [ ! -e relay.env ] || mv relay.env relay.env.failed
            [ ! -e slingshot-server.prev ] || mv slingshot-server.prev slingshot-server
            [ ! -e relay.env.prev ] || mv relay.env.prev relay.env
            systemctl --user reset-failed slingshot-relay.service 2>/dev/null || true
            systemctl --user restart slingshot-relay.service || true
            sleep 2
            systemctl --user status slingshot-relay.service --no-pager || true
          '
          if ! ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd /srv/slingshot && $remote_deploy"; then
            echo 'Deployment restart failed; restoring previous binary and configuration.' >&2
            ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd /srv/slingshot && $remote_rollback" || true
            exit 1
          fi

          websocket_healthcheck() {
            node - "$RELAY_HEALTHCHECK_URL" "$RELAY_ALLOWED_ORIGINS" <<'NODE'
          const crypto = require('node:crypto');
          const net = require('node:net');
          const tls = require('node:tls');
          const url = new URL(process.argv[2]);
          if (url.protocol !== 'wss:' && url.protocol !== 'ws:') throw new Error('health-check URL must use ws:// or wss://');
          const origin = process.argv[3].split(',')[0].trim();
          const key = crypto.randomBytes(16).toString('base64');
          const expected = crypto.createHash('sha1').update(key + '258EAFA5-E914-47DA-95CA-C5AB0DC85B11').digest('base64');
          const port = Number(url.port || (url.protocol === 'wss:' ? 443 : 80));
          const options = { host: url.hostname, port };
          const socket = url.protocol === 'wss:' ? tls.connect({ ...options, servername: url.hostname }) : net.connect(options);
          let response = '';
          let done = false;
          const fail = (error) => {
            if (done) return;
            done = true;
            socket.destroy();
            console.error(error.message);
            process.exitCode = 1;
          };
          socket.setTimeout(5000, () => fail(new Error('WebSocket health check timed out')));
          socket.on('error', fail);
          socket.on('connect', () => {
            if (url.protocol === 'wss:') return;
            const path = `${url.pathname || '/'}${url.search}`;
            socket.write(`GET ${path} HTTP/1.1\r\nHost: ${url.host}\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Key: ${key}\r\nSec-WebSocket-Version: 13\r\nOrigin: ${origin}\r\n\r\n`);
          });
          socket.on('secureConnect', () => {
            if (url.protocol !== 'wss:') return;
            const path = `${url.pathname || '/'}${url.search}`;
            socket.write(`GET ${path} HTTP/1.1\r\nHost: ${url.host}\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Key: ${key}\r\nSec-WebSocket-Version: 13\r\nOrigin: ${origin}\r\n\r\n`);
          });
          socket.on('data', (chunk) => {
            response += chunk.toString('latin1');
            const boundary = response.indexOf('\r\n\r\n');
            if (boundary < 0) return;
            const [status, ...headers] = response.slice(0, boundary).split('\r\n');
            const accept = headers.find((header) => /^sec-websocket-accept:/i.test(header))?.split(':', 2)[1]?.trim();
            if (!/^HTTP\/1\.1 101\b/.test(status) || accept !== expected) return fail(new Error(`Invalid WebSocket handshake: ${status}; accept=${accept ?? 'missing'}`));
            done = true;
            socket.destroy();
            console.log(`WebSocket handshake OK: ${url.host}`);
          });
          NODE
          }

          healthy=false
          for attempt in {1..10}; do
            if websocket_healthcheck; then healthy=true; break; fi
            echo "WebSocket health check attempt $attempt/10 failed; retrying..." >&2
            sleep 3
          done
          if [[ "$healthy" != true ]]; then
            echo 'Health check failed; restoring previous binary and configuration.' >&2
            ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "cd /srv/slingshot && $remote_rollback" || true
            exit 1
          fi
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'cd /srv/slingshot && rm -f slingshot-server.prev relay.env.prev && journalctl --user -u slingshot-relay.service -n 10 --no-pager || true'

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # need all tags to work out the version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Determine version
        id: version
        # A pushed tag is released as it is. Otherwise: the tag on HEAD if there is one (already released,
        # nothing to do), else the next minor after the latest tag, which the release job will create.
        # A commit since the latest tag with [major] in its message makes it the next major instead.
        run: |
          semver='^v[0-9]+\.[0-9]+\.[0-9]+$'
          release=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            release=true
          else
            tag=$(git tag --points-at HEAD | grep -E "$semver" | head -n 1 || true)
            if [ -z "$tag" ]; then
              latest=$(git tag -l 'v*' --sort=-v:refname | grep -E "$semver" | head -n 1 || true)
              # No release yet: start from the version in package.json.
              latest=${latest:-v$(node -p "require('./package.json').version")}
              IFS=. read -r major minor _ <<< "${latest#v}"
              if git log --format=%B "$latest..HEAD" 2>/dev/null | grep -qiF '[major]'; then
                tag="v$((major + 1)).0.0"
              else
                tag="v$major.$((minor + 1)).0"
              fi
              if [ "$GITHUB_EVENT_NAME" = push ]; then release=true; fi
            fi
          fi
          echo "Version $tag (release: $release)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "VITE_APP_VERSION=$tag" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
        env:
          VITE_COFFEE_URL: ${{ vars.VITE_COFFEE_URL }}
          VITE_MULTIPLAYER_SERVER: ${{ vars.VITE_MULTIPLAYER_SERVER }}
      - name: Zip the build for the release
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: (cd dist && zip -r "../slingshot-$TAG.zip" .)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.version.outputs.release == 'true'
        with:
          name: release-zip
          path: slingshot-*.zip
          if-no-files-found: error
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: dist

  # Publish the main-branch build on every merge, retaining the github-pages environment's main gate.
  deploy-pages:
    needs: [build, server-x86_64, relay-changes, deploy-relay]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.build.result == 'success' && needs.server-x86_64.result == 'success' &&
      needs.relay-changes.result == 'success' &&
      (needs.deploy-relay.result == 'success' || needs.deploy-relay.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  release:
    needs: [build, server-x86_64]
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-zip
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: server-x86_64
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          mv slingshot-server slingshot-server-linux-x86_64
          sha256sum slingshot-server-linux-x86_64 > slingshot-server-linux-x86_64.sha256
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "slingshot-$TAG.zip" slingshot-server-linux-x86_64 \
              slingshot-server-linux-x86_64.sha256 --clobber
          else
            gh release create "$TAG" "slingshot-$TAG.zip" slingshot-server-linux-x86_64 \
              slingshot-server-linux-x86_64.sha256 \
              --target "$GITHUB_SHA" \
              --title "Slingshot $TAG" \
              --generate-notes
          fi
