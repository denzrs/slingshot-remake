name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need all tags to work out the version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Determine version
        # Mirrors release.yml: the tag on HEAD if the release job got there first,
        # otherwise the next minor after the latest tag (what the release job will create).
        run: |
          semver='^v[0-9]+\.[0-9]+\.[0-9]+$'
          tag=$(git tag --points-at HEAD | grep -E "$semver" | head -n 1 || true)
          if [ -z "$tag" ]; then
            latest=$(git tag -l 'v*' --sort=-v:refname | grep -E "$semver" | head -n 1 || true)
            latest=${latest:-v$(node -p "require('./package.json').version")}
            IFS=. read -r major minor _ <<< "${latest#v}"
            tag="v$major.$((minor + 1)).0"
          fi
          echo "VITE_APP_VERSION=$tag" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
