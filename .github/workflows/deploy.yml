name: Test, Deploy & Release

# Every push to main (i.e. every merge) that passes the tests is built once, deployed to GitHub Pages
# and released under the next minor version (vX.Y.0 -> vX.(Y+1).0).
# Major bumps are manual: push a tag such as v2.0.0 and it gets released as-is (not deployed);
# the next merge then continues from there (v2.1.0).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Runs on main and for tags queue up one after another, so every merge gets its own consecutive version.
# Only a superseded run of the same pull request is cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'main-line' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache-workspaces: server
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: cargo fmt --manifest-path server/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path server/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path server/Cargo.toml
      - run: npm test

  server-x86_64:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache-workspaces: server
          components: rustfmt, clippy
      - name: Build the relay for x86_64
        working-directory: server
        run: cargo build --locked --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-x86_64
          path: server/target/release/slingshot-server

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # need all tags to work out the version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Determine version
        id: version
        # A pushed tag is released as it is. Otherwise: the tag on HEAD if there is one (already released,
        # nothing to do), else the next minor after the latest tag, which the release job will create.
        run: |
          semver='^v[0-9]+\.[0-9]+\.[0-9]+$'
          release=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            release=true
          else
            tag=$(git tag --points-at HEAD | grep -E "$semver" | head -n 1 || true)
            if [ -z "$tag" ]; then
              latest=$(git tag -l 'v*' --sort=-v:refname | grep -E "$semver" | head -n 1 || true)
              # No release yet: start from the version in package.json.
              latest=${latest:-v$(node -p "require('./package.json').version")}
              IFS=. read -r major minor _ <<< "${latest#v}"
              tag="v$major.$((minor + 1)).0"
              if [ "$GITHUB_EVENT_NAME" = push ]; then release=true; fi
            fi
          fi
          echo "Version $tag (release: $release)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "VITE_APP_VERSION=$tag" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - name: Zip the build for the release
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: (cd dist && zip -r "../slingshot-$TAG.zip" .)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.version.outputs.release == 'true'
        with:
          name: release-zip
          path: slingshot-*.zip
          if-no-files-found: error
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: github.ref_type != 'tag'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.ref_type != 'tag'
        with:
          path: dist

  # Waits for server-arm64 as well: the site shows the version the release job is about to create,
  # so it must not go live when the release can't follow.
  deploy:
    needs: [build, server-arm64]
    if: github.event_name != 'pull_request' && github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  release:
    needs: [build, server-x86_64]
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-zip
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: server-x86_64
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          mv slingshot-server slingshot-server-linux-x86_64
          sha256sum slingshot-server-linux-x86_64 > slingshot-server-linux-x86_64.sha256
          gh release create "$TAG" "slingshot-$TAG.zip" slingshot-server-linux-x86_64 \
            slingshot-server-linux-x86_64.sha256 \
            --target "$GITHUB_SHA" \
            --title "Slingshot $TAG" \
            --generate-notes
