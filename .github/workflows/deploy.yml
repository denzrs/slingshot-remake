name: Test, Deploy & Release

# Tagged v* releases that pass the tests are built, deployed to GitHub Pages and released as-is.

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Release and production-deployment runs queue up one after another. Only a superseded run of the
# same pull request is cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'main-line' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache-workspaces: server
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: cargo fmt --manifest-path server/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path server/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path server/Cargo.toml
      - run: npm test

  server-x86_64:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: x86_64-unknown-linux-musl
          cache-workspaces: server
          components: rustfmt, clippy
      - name: Build the relay for x86_64 (static musl)
        working-directory: server
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          cargo build --locked --release --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-x86_64
          path: server/target/x86_64-unknown-linux-musl/release/slingshot-server

  deploy-relay-pr:
    name: Deploy relay to IONOS (deployment PR only)
    needs: [test, server-x86_64]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ionos_coffee_deplyoment' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: server-x86_64
          path: server/target/x86_64-unknown-linux-musl/release

      - name: Prepare relay and SSH credentials
        env:
          DEPLOY_SSH_KEY: ${{ secrets.IONOS_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.IONOS_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.IONOS_SERVER_IP }}
          DEPLOY_USER: ${{ vars.IONOS_DEPLOY_USER }}
          RELAY_PORT: ${{ vars.RELAY_PORT }}
          RELAY_ALLOWED_ORIGINS: ${{ vars.RELAY_ALLOWED_ORIGINS }}
          RELAY_MAX_CONNECTIONS: ${{ vars.RELAY_MAX_CONNECTIONS }}
          RELAY_MAX_CONNECTIONS_PER_IP: ${{ vars.RELAY_MAX_CONNECTIONS_PER_IP }}
          RELAY_CONNECTIONS_PER_IP_PER_SECOND: ${{ vars.RELAY_CONNECTIONS_PER_IP_PER_SECOND }}
          RELAY_MAX_MESSAGES_PER_SECOND: ${{ vars.RELAY_MAX_MESSAGES_PER_SECOND }}
          RELAY_TLS_CERT: ${{ vars.RELAY_TLS_CERT }}
          RELAY_TLS_KEY: ${{ vars.RELAY_TLS_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY" || { echo 'IONOS_DEPLOY_SSH_KEY is required' >&2; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo 'IONOS_DEPLOY_KNOWN_HOSTS is required' >&2; exit 1; }
          test -n "$DEPLOY_HOST" || { echo 'IONOS_SERVER_IP is required' >&2; exit 1; }
          test -n "$DEPLOY_USER" || { echo 'IONOS_DEPLOY_USER is required' >&2; exit 1; }
          test -n "$RELAY_ALLOWED_ORIGINS" || { echo 'RELAY_ALLOWED_ORIGINS is required' >&2; exit 1; }
          : "${RELAY_PORT:=8080}"
          : "${RELAY_MAX_CONNECTIONS:=1000}"
          : "${RELAY_MAX_CONNECTIONS_PER_IP:=64}"
          : "${RELAY_CONNECTIONS_PER_IP_PER_SECOND:=20}"
          : "${RELAY_MAX_MESSAGES_PER_SECOND:=300}"
          if ! [[ "$RELAY_PORT" =~ ^[0-9]{1,5}$ ]] || (( 10#$RELAY_PORT < 1 || 10#$RELAY_PORT > 65535 )); then
            echo 'RELAY_PORT must be an integer from 1 to 65535' >&2
            exit 1
          fi
          if [[ -n "$RELAY_TLS_CERT" && -z "$RELAY_TLS_KEY" || -z "$RELAY_TLS_CERT" && -n "$RELAY_TLS_KEY" ]]; then
            echo 'Set RELAY_TLS_CERT and RELAY_TLS_KEY together' >&2
            exit 1
          fi
          for value in "$RELAY_ALLOWED_ORIGINS" "$RELAY_TLS_CERT" "$RELAY_TLS_KEY"; do
            case "$value" in *$'\n'*|*$'\r'*) echo 'Multiline relay settings are unsupported' >&2; exit 1;; esac
          done
          install -m 0700 -d "$RUNNER_TEMP/ionos-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ionos-ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ionos-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/ionos-ssh/id_ed25519" "$RUNNER_TEMP/ionos-ssh/known_hosts"
          chmod 0755 server/target/x86_64-unknown-linux-musl/release/slingshot-server
          {
            printf 'PORT=%s\n' "$RELAY_PORT"
            printf 'ALLOWED_ORIGINS=%s\n' "$RELAY_ALLOWED_ORIGINS"
            printf 'MAX_CONNECTIONS=%s\n' "$RELAY_MAX_CONNECTIONS"
            printf 'MAX_CONNECTIONS_PER_IP=%s\n' "$RELAY_MAX_CONNECTIONS_PER_IP"
            printf 'CONNECTIONS_PER_IP_PER_SECOND=%s\n' "$RELAY_CONNECTIONS_PER_IP_PER_SECOND"
            printf 'MAX_MESSAGES_PER_SECOND=%s\n' "$RELAY_MAX_MESSAGES_PER_SECOND"
            [[ -z "$RELAY_TLS_CERT" ]] || printf 'TLS_CERT=%s\n' "$RELAY_TLS_CERT"
            [[ -z "$RELAY_TLS_KEY" ]] || printf 'TLS_KEY=%s\n' "$RELAY_TLS_KEY"
          } > "$RUNNER_TEMP/relay.env"
          echo "DEPLOY_HOST=$DEPLOY_HOST" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=$DEPLOY_USER" >> "$GITHUB_ENV"

      - name: Copy relay files to VPS
        run: |
          set -euo pipefail
          ssh_options=(-i "$RUNNER_TEMP/ionos-ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ionos-ssh/known_hosts")
          scp "${ssh_options[@]}" \
            server/target/x86_64-unknown-linux-musl/release/slingshot-server \
            deploy/ionos/install-relay.sh deploy/ionos/slingshot-relay.service \
            "$RUNNER_TEMP/relay.env" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/"

      - name: Install and restart relay service
        id: install
        run: |
          set -euo pipefail
          ssh_options=(-i "$RUNNER_TEMP/ionos-ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ionos-ssh/known_hosts")
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'sudo bash /tmp/install-relay.sh'

      - name: Verify relay service is active
        id: verify
        if: steps.install.outcome == 'success'
        run: |
          set -euo pipefail
          ssh_options=(-i "$RUNNER_TEMP/ionos-ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ionos-ssh/known_hosts")
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo systemctl is-active --quiet slingshot-relay.service && sudo systemctl --no-pager --full status slingshot-relay.service'

      - name: Restore previous relay binary if the PR deployment fails
        if: failure() && steps.install.outcome != 'skipped'
        run: |
          set -euo pipefail
          ssh_options=(-i "$RUNNER_TEMP/ionos-ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ionos-ssh/known_hosts")
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo test -x /usr/local/bin/slingshot-server.previous && sudo install -o root -g root -m 0755 /usr/local/bin/slingshot-server.previous /usr/local/bin/slingshot-server && sudo systemctl restart slingshot-relay.service && sudo systemctl is-active --quiet slingshot-relay.service'

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # need all tags to work out the version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Determine version
        id: version
        # A pushed tag is released as it is. Otherwise: the tag on HEAD if there is one (already released,
        # nothing to do), else the next minor after the latest tag, which the release job will create.
        run: |
          semver='^v[0-9]+\.[0-9]+\.[0-9]+$'
          release=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            release=true
          else
            tag=$(git tag --points-at HEAD | grep -E "$semver" | head -n 1 || true)
            if [ -z "$tag" ]; then
              latest=$(git tag -l 'v*' --sort=-v:refname | grep -E "$semver" | head -n 1 || true)
              # No release yet: start from the version in package.json.
              latest=${latest:-v$(node -p "require('./package.json').version")}
              IFS=. read -r major minor _ <<< "${latest#v}"
              tag="v$major.$((minor + 1)).0"
              if [ "$GITHUB_EVENT_NAME" = push ]; then release=true; fi
            fi
          fi
          echo "Version $tag (release: $release)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "VITE_APP_VERSION=$tag" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
        env:
          VITE_COFFEE_URL: ${{ vars.VITE_COFFEE_URL }}
          VITE_MULTIPLAYER_SERVER: ${{ vars.VITE_MULTIPLAYER_SERVER }}
      - name: Zip the build for the release
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: (cd dist && zip -r "../slingshot-$TAG.zip" .)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.version.outputs.release == 'true'
        with:
          name: release-zip
          path: slingshot-*.zip
          if-no-files-found: error
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: github.ref_type == 'tag'
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.ref_type == 'tag'
        with:
          path: dist

  # Waits for server-x86_64 as well: the site shows the version the release job is about to create,
  # so it must not go live when the release can't follow.
  deploy-pages:
    needs: [build, server-x86_64]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  release:
    needs: [build, server-x86_64]
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-zip
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: server-x86_64
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          mv slingshot-server slingshot-server-linux-x86_64
          sha256sum slingshot-server-linux-x86_64 > slingshot-server-linux-x86_64.sha256
          gh release create "$TAG" "slingshot-$TAG.zip" slingshot-server-linux-x86_64 \
            slingshot-server-linux-x86_64.sha256 \
            --target "$GITHUB_SHA" \
            --title "Slingshot $TAG" \
            --generate-notes
