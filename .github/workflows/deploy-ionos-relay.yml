name: Deploy multiplayer relay to IONOS VPS

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      initial_deploy:
        description: One-time IONOS relay deployment check from ionos_coffee_deplyoment (not GitHub Pages)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ionos-relay-production
  cancel-in-progress: false

jobs:
  detect-rust-backend:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.detect.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: detect
        name: Wait for the Rust relay branch to be merged
        run: |
          if [ -f server/Cargo.toml ] && [ -f server/src/main.rs ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Rust relay sources are not present yet; deployment is intentionally skipped.'
          fi

  build-relay:
    needs: detect-rust-backend
    if: needs.detect-rust-backend.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache-workspaces: server

      - name: Build relay
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --locked --release --target x86_64-unknown-linux-musl --manifest-path server/Cargo.toml

      - name: Upload x86_64 Linux artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slingshot-server-linux-x86_64
          path: server/target/x86_64-unknown-linux-musl/release/slingshot-server
          if-no-files-found: error

  deploy-relay:
    needs: build-relay
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ionos_coffee_deplyoment' && inputs.initial_deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: slingshot-server-linux-x86_64
          path: server/target/x86_64-unknown-linux-musl/release

      - name: Mark relay binary executable
        run: chmod 0755 server/target/x86_64-unknown-linux-musl/release/slingshot-server

      - name: Prepare SSH credentials
        env:
          DEPLOY_SSH_KEY: ${{ secrets.IONOS_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.IONOS_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 0700 -d "$RUNNER_TEMP/ionos-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ionos-ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ionos-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/ionos-ssh/id_ed25519" "$RUNNER_TEMP/ionos-ssh/known_hosts"

      - name: Copy relay files to VPS
        env:
          DEPLOY_HOST: ${{ vars.IONOS_SERVER_IP }}
          DEPLOY_USER: ${{ vars.IONOS_DEPLOY_USER }}
          RELAY_PORT: ${{ vars.RELAY_PORT }}
          RELAY_ALLOWED_ORIGINS: ${{ vars.RELAY_ALLOWED_ORIGINS }}
          RELAY_MAX_CONNECTIONS: ${{ vars.RELAY_MAX_CONNECTIONS }}
          RELAY_MAX_CONNECTIONS_PER_IP: ${{ vars.RELAY_MAX_CONNECTIONS_PER_IP }}
          RELAY_CONNECTIONS_PER_IP_PER_SECOND: ${{ vars.RELAY_CONNECTIONS_PER_IP_PER_SECOND }}
          RELAY_MAX_MESSAGES_PER_SECOND: ${{ vars.RELAY_MAX_MESSAGES_PER_SECOND }}
          RELAY_TLS_CERT: ${{ vars.RELAY_TLS_CERT }}
          RELAY_TLS_KEY: ${{ vars.RELAY_TLS_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          : "${RELAY_PORT:=8080}"
          : "${RELAY_MAX_CONNECTIONS:=1000}"
          : "${RELAY_MAX_CONNECTIONS_PER_IP:=64}"
          : "${RELAY_CONNECTIONS_PER_IP_PER_SECOND:=20}"
          : "${RELAY_MAX_MESSAGES_PER_SECOND:=300}"
          test -n "$RELAY_ALLOWED_ORIGINS"
          if ! [[ "$RELAY_PORT" =~ ^[0-9]{1,5}$ ]] || (( 10#$RELAY_PORT < 1 || 10#$RELAY_PORT > 65535 )); then
            echo 'RELAY_PORT must be an integer from 1 to 65535' >&2
            exit 1
          fi
          for value in "$RELAY_PORT" "$RELAY_ALLOWED_ORIGINS" "$RELAY_MAX_CONNECTIONS" "$RELAY_MAX_CONNECTIONS_PER_IP" "$RELAY_CONNECTIONS_PER_IP_PER_SECOND" "$RELAY_MAX_MESSAGES_PER_SECOND" "$RELAY_TLS_CERT" "$RELAY_TLS_KEY"; do
            case "$value" in *$'\n'*|*$'\r'*) echo 'Multiline relay settings are not supported' >&2; exit 1;; esac
          done
          if [[ -n "$RELAY_TLS_CERT" && -z "$RELAY_TLS_KEY" || -z "$RELAY_TLS_CERT" && -n "$RELAY_TLS_KEY" ]]; then
            echo 'Set RELAY_TLS_CERT and RELAY_TLS_KEY together' >&2
            exit 1
          fi
          config="$RUNNER_TEMP/relay.env"
          {
            printf 'PORT=%s\n' "$RELAY_PORT"
            printf 'ALLOWED_ORIGINS=%s\n' "$RELAY_ALLOWED_ORIGINS"
            printf 'MAX_CONNECTIONS=%s\n' "$RELAY_MAX_CONNECTIONS"
            printf 'MAX_CONNECTIONS_PER_IP=%s\n' "$RELAY_MAX_CONNECTIONS_PER_IP"
            printf 'CONNECTIONS_PER_IP_PER_SECOND=%s\n' "$RELAY_CONNECTIONS_PER_IP_PER_SECOND"
            printf 'MAX_MESSAGES_PER_SECOND=%s\n' "$RELAY_MAX_MESSAGES_PER_SECOND"
            [[ -z "$RELAY_TLS_CERT" ]] || printf 'TLS_CERT=%s\n' "$RELAY_TLS_CERT"
            [[ -z "$RELAY_TLS_KEY" ]] || printf 'TLS_KEY=%s\n' "$RELAY_TLS_KEY"
          } > "$config"
          ssh_options=(-i "$RUNNER_TEMP/ionos-ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ionos-ssh/known_hosts")
          scp "${ssh_options[@]}" \
            server/target/x86_64-unknown-linux-musl/release/slingshot-server \
            "$DEPLOY_USER@$DEPLOY_HOST:/srv/slingshot/slingshot-server.new"
          scp "${ssh_options[@]}" \
            "$config" "$DEPLOY_USER@$DEPLOY_HOST:/srv/slingshot/relay.env.new"

      - name: Install relay files and restart service
        id: install
        env:
          DEPLOY_HOST: ${{ vars.IONOS_SERVER_IP }}
          DEPLOY_USER: ${{ vars.IONOS_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh_options=(-i "$RUNNER_TEMP/ionos-ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ionos-ssh/known_hosts")
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            'mv /srv/slingshot/slingshot-server.new /srv/slingshot/slingshot-server && mv /srv/slingshot/relay.env.new /srv/slingshot/relay.env && chmod 0755 /srv/slingshot/slingshot-server && chmod 0640 /srv/slingshot/relay.env && sudo -n /usr/bin/systemctl restart slingshot-relay.service'

      - name: Check service status
        id: status
        env:
          DEPLOY_HOST: ${{ vars.IONOS_SERVER_IP }}
          DEPLOY_USER: ${{ vars.IONOS_DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh_options=(-i "$RUNNER_TEMP/ionos-ssh/id_ed25519" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ionos-ssh/known_hosts")
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo -n /usr/bin/systemctl is-active --quiet slingshot-relay.service'

      - name: Verify relay WebSocket handshake
        id: healthcheck
        env:
          RELAY_URL: ${{ vars.RELAY_HEALTHCHECK_URL }}
          RELAY_ALLOWED_ORIGINS: ${{ vars.RELAY_ALLOWED_ORIGINS }}
        run: |
          set -euo pipefail
          test -n "$RELAY_URL" || { echo 'RELAY_HEALTHCHECK_URL is required for production deploys' >&2; exit 1; }
          python3 - <<'PY'
          import os, socket, ssl, base64, hashlib, urllib.parse
          url = urllib.parse.urlparse(os.environ['RELAY_URL'])
          if url.scheme not in ('ws', 'wss') or not url.hostname:
              raise SystemExit('RELAY_HEALTHCHECK_URL must be a ws:// or wss:// URL')
          port = url.port or (443 if url.scheme == 'wss' else 80)
          expected_origin = os.environ['RELAY_ALLOWED_ORIGINS'].split(',')[0]
          path = url.path or '/'
          if url.query: path += '?' + url.query
          import time
          for attempt in range(1, 6):
              try:
                  raw = socket.create_connection((url.hostname, port), timeout=10)
                  conn = ssl.create_default_context().wrap_socket(raw, server_hostname=url.hostname) if url.scheme == 'wss' else raw
                  key = base64.b64encode(os.urandom(16)).decode()
                  request = (f'GET {path} HTTP/1.1\r\nHost: {url.hostname}\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Key: {key}\r\nSec-WebSocket-Version: 13\r\nOrigin: {expected_origin}\r\n\r\n')
                  conn.sendall(request.encode())
                  response = conn.recv(4096).decode('latin1')
                  expected = base64.b64encode(hashlib.sha1((key + '258EAFA5-E914-47DA-95CA-C5AB0DC85B11').encode()).digest()).decode()
                  lines = response.split('\r\n')
                  headers = {}
                  for line in lines[1:]:
                      if ':' in line:
                          name, value = line.split(':', 1)
                          headers[name.strip().lower()] = value.strip()
                  if lines[0].startswith('HTTP/1.1 101') and headers.get('sec-websocket-accept') == expected:
                      print('Relay WebSocket handshake succeeded')
                      conn.close()
                      break
                  raise RuntimeError(f'WebSocket handshake failed: {lines[0] if lines and lines[0] else "no response"}')
              except Exception as error:
                  if attempt == 5:
                      raise SystemExit(f'WebSocket handshake failed after {attempt} attempts: {error}')
                  print(f'WebSocket handshake attempt {attempt} failed: {error}; retrying in 3 seconds')
                  time.sleep(3)
          PY
